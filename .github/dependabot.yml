# Dependabot 自动依赖更新配置
# 说明: 仓库内第三方 actions 均按 commit SHA 固定, Dependabot 会同步更新 SHA 与版本注释;
#       更新 PR 仍需通过统一工作流的全部质量门与产物功能测试后合并。
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # 自动维护工具(Node): 当前无运行时依赖, 配置保留以便后续引入依赖时自动获得更新
  - package-ecosystem: "npm"
    directory: "/tools/auto-maintain"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
