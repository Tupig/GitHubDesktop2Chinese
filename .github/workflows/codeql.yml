name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 OpenSSL (CMake 配置需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFILE_VERSION="codeql"

      - name: Build for CodeQL
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"
