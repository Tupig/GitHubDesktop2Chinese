    timeout-minutes: 40
    env:
      # inputs 上下文仅 dispatch 事件可用 → 统一经 github.event.inputs 读取, PR 事件回退默认值
      OSSL_VER: ${{ github.event.inputs.openssl-version || '3.5.9' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 编译 OpenSSL（x64 ≈8 分钟）
        run: |
          set -euo pipefail
          TARGET=darwin64-x86_64-cc
          if ! printf '%s' "$OSSL_VER" | grep -qE '^3\.[0-9]+\.[0-9]+$'; then
            echo "::error::openssl-version 格式非法: $OSSL_VER（应为 3.x.y）"
            exit 1
          fi
          # 与主构建一致的部署目标, 防止 SDK 差异引入更高系统版本依赖
          export MACOSX_DEPLOYMENT_TARGET=11.0
          cd "$RUNNER_TEMP"
          rm -rf openssl-src "openssl-$OSSL_VER.tar.gz" "openssl-$OSSL_VER.tar.gz.sha256"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          # 供应链校验(#118): 官方 release 附带的 .sha256 旁证(openssl.org/source 链接的同一文件), 对照后才解压
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz.sha256" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz.sha256"
          sha256sum -c "openssl-$OSSL_VER.tar.gz.sha256"
          mkdir -p openssl-src
          tar -xzf "openssl-$OSSL_VER.tar.gz" -C openssl-src --strip-components=1
          cd openssl-src
          ./Configure "$TARGET" no-shared no-tests no-apps no-zlib \
            --prefix="$RUNNER_TEMP/openssl-macos-x64"
          make -j"$(sysctl -n hw.ncpu)" build_libs
          make install_dev

      - name: 校验产物齐备
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/openssl-macos-x64"
          for f in "$PREFIX/include/openssl/ssl.h" "$PREFIX/lib/libssl.a" "$PREFIX/lib/libcrypto.a"; do
            [[ -f "$f" ]] || { echo "::error::缺少产物: $f"; exit 1; }
          done
          echo "产库产物齐备: $PREFIX"

      - name: 上传产库产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssl-macos-x64
          path: |
            ${{ runner.temp }}/openssl-macos-x64/include
            ${{ runner.temp }}/openssl-macos-x64/lib
          retention-days: 7
          if-no-files-found: error

  # ═════════════════════════════════════════════════
  # 8. 发布 Release（push main 有变更 / tag v* / 手动 auto|release / 定时且有变更）
  #    依赖 build 产物与 version 版本号
  # ═════════════════════════════════════════════════
  Release:
    name: 发布 Release
    # Build/JsonCheck/CodeqlScan 与 Release 同属任务门: 发布前强制过构建/质量/安全门
    # (三者 if 已覆盖发布相关分支, 不会出现 needs 悬空)
    needs: [Build, JsonCheck, CodeqlScan]
    # 发布边界: push main 仅在存在构建相关变更时自动补丁发版; 手动 auto/release 仅限 main(防特性分支误发布)
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.Version.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.type == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.type == 'auto' && needs.Version.outputs.changed == 'true') ||
      (github.event_name == 'schedule' && needs.Version.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # SignPath 签名后需对签名产物重新生成构建溯源证明(OIDC)
      id-token: write
      # attest-build-provenance 写入 attestation；缺失时 SignPath 启用后该步骤 403 阻断发布（#117）
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.Version.outputs.version }}
      # SignPath 代码签名(Foundation 免费开源证书): token 与组织 ID 齐备才签名, 缺任一则跳过
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 校验版本号
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          if [[ -z "$VER" ]]; then
            echo "::error::版本号为空，无法发布。请检查 version 任务输出"
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VER'（须为 x.y.z），拒绝发布"
            exit 1
          fi
          echo "发布版本: v$VER"
          # 版本漂移检查: 并发排队时 version 在排队前计算, 发布时最新 tag 可能已前进;
          # 正常情况下最新 tag 应为 v<x.y.(z-1)>, 不一致仅告警不阻断(记录实际对应关系)
          LATEST_TAG="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n1 || true)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          # 按进位规则反推预期前驱: patch>1 直接减 1; patch=1 由 minor-1 的 patch=100 进位而来; 依此类推
          if [[ "$PATCH" -gt 1 ]]; then
            EXPECT_PREV="v${MAJOR}.${MINOR}.$((PATCH-1))"
          elif [[ "$MINOR" -gt 0 ]]; then
            EXPECT_PREV="v${MAJOR}.$((MINOR-1)).100"
          elif [[ "$MAJOR" -gt 0 ]]; then
            EXPECT_PREV="v$((MAJOR-1)).100.100"
          else
            EXPECT_PREV=""
          fi
          if [[ -n "$LATEST_TAG" && -n "$EXPECT_PREV" ]]; then
            if [[ "$LATEST_TAG" != "$EXPECT_PREV" ]]; then
              echo "::warning::版本漂移: 当前最新 tag 为 ${LATEST_TAG}, 预期 ${EXPECT_PREV}; 本次实际发布 v${VER}"
            else
              echo "版本链正常: 最新 tag ${LATEST_TAG} -> v${VER}"
            fi
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # GitHubDesktop2Chinese-<平台>-<版本|SHA>（windows-x64 / macos-universal / linux-x64）
          pattern: ${{ env.ARTIFACT_PREFIX }}-*-${{ needs.Version.outputs.version || github.sha }}
          path: release/
          merge-multiple: true

      - name: 准备 localization.json
        run: |
          set -euo pipefail
          mkdir -p release
          cp "json/localization.json" release/

      - name: SignPath 门控判定
        # token 与组织 ID 齐备才启用签名链路; 判定一次, 后续 4 个签名步骤统一引用(单一维护点, 防四处条件漂移)
        id: signpath_gate
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${SIGNPATH_API_TOKEN:-}" && -n "${SIGNPATH_ORGANIZATION_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath 凭据齐备, 启用 Windows 产物签名链路"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath 凭据不齐备, 跳过 Windows 产物签名(#79 按实际状态门控)"
          fi

      - name: 上传待签名 Windows 产物
        # SignPath 前置要求: 待签名文件须先作为 GitHub artifact 上传(v4+), 以 artifact-id 提交签名请求
        id: upload-unsigned
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows-${{ needs.Version.outputs.version || github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: release/GitHubDesktop2Chinese.exe

      - name: SignPath 代码签名（Windows exe）
        # SignPath Foundation 免费开源代码签名; project/policy slug 可用仓库 variables 覆盖
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'GitHubDesktop2Chinese' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: 替换为已签名 Windows 产物
        if: steps.signpath_gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -f signed/GitHubDesktop2Chinese.exe
          cp signed/GitHubDesktop2Chinese.exe release/GitHubDesktop2Chinese.exe
          echo "已用 SignPath 签名产物替换 release/GitHubDesktop2Chinese.exe"

      - name: 为签名产物重新生成构建溯源证明
        # build 任务的 attestation 绑定未签名 exe 摘要, 签名后内容已变;
        # 对签名产物重新 attest, 保证 release 资产可通过 gh attestation verify 校验
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/GitHubDesktop2Chinese.exe

      - name: 生成 Release 说明
        shell: bash
        env:
          # 变更记录自动提取需查询 tags / compare API
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          {
            echo "# GitHubDesktop2Chinese v$VER"
            echo ""
            echo "自动构建产物："
            echo "- \`GitHubDesktop2Chinese.exe\` — Windows x64（64 位 Windows）"
            echo "- \`GitHubDesktop2Chinese-macos-x64\` — macOS Intel（x64）"
            echo "- \`GitHubDesktop2Chinese-macos-arm64\` — macOS Apple Silicon（M 系列）"
            echo "- \`GitHubDesktop2Chinese-linux-x64\` — Linux x86_64"
            echo "- \`localization.json\` — 汉化映射（最新）"
            echo ""
            echo "> 产物附带构建溯源证明，可校验来源：\`gh attestation verify <下载的文件> --repo Tupig/GitHubDesktop2Chinese\`"
            # SignPath Foundation 要求: 使用其证书签名时下载页须作此声明; 未签名时不得失实提及(#79)
            if [[ -n "${SIGNPATH_API_TOKEN:-}" && -n "${SIGNPATH_ORGANIZATION_ID:-}" ]]; then
              echo "> Windows 产物使用 [SignPath Foundation](https://signpath.org) 免费开源代码签名证书签名"
            fi
            echo ""
            echo "## 使用方法"
            echo "1. 下载对应平台的程序文件直接运行，自动联网获取最新 \`localization.json\` 完成汉化"
            echo "2. 或将程序文件与 \`localization.json\` 放在同一文件夹运行"
            echo "3. GitHub Desktop 每次版本更新后需重新运行一次"
            echo ""
            echo "> ⚠️ 仅支持 64 位系统 / GitHub Desktop。macOS/Linux 首次运行请先 \`chmod +x\`；"
            echo "> Windows 找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable"
            if [[ -f docs/ReleaseBody.md ]]; then
              # 仅提取当前版本的变更行(行内含版本标记: 全角括号+vX.Y.Z),
              # 不再整篇附带从 v1.2.0 起的历史日志
              CHANGES="$(grep -F "（v$VER）" docs/ReleaseBody.md || true)"
              # 变更记录自动化: 未预置当前版本条目时, 自动提取上一发布版本以来的提交标题,
              # 生成条目写入 docs/ReleaseBody.md 的 Changelog 段末尾, 供 Release 说明与后续发布读取
              AUTO_EXTRACTED=""
              if [[ -z "$CHANGES" ]]; then
                TAGS="$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --paginate -q '.[].name' 2>/dev/null || true)"
                if [[ -n "$TAGS" ]]; then
                  # 版本序取严格小于当前版本的最大 tag(权重比较, 字典序在 patch>=10 时不可靠)
                  PREV_TAG="$(printf '%s\n' "$TAGS" | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V \
                    | awk -F. -v v="$VER" 'BEGIN { split(v, c, ".") } { p1 = $1; sub(/^v/, "", p1); if ((p1 * 1000000 + $2 * 1000 + $3) < (c[1] * 1000000 + c[2] * 1000 + c[3])) print }' | tail -n1)"
                  if [[ -n "$PREV_TAG" ]]; then
                    SUBJECTS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_SHA}" \
                      -q '.commits[] | select((.parents | length) == 1) | .commit.message | split("\n")[0]' 2>/dev/null || true)"
                    if [[ -n "$SUBJECTS" ]]; then
                      AUTO_ENTRIES=""
                      while IFS= read -r subject; do
                        if [[ -n "$subject" ]]; then
                          AUTO_ENTRIES+="- ${subject}（v$VER）"$'\n'
                        fi
                      done <<< "$SUBJECTS"
                      AUTO_ENTRIES="${AUTO_ENTRIES%$'\n'}"
                      # 插入 Changelog 段末尾(首个 <!-- 注释块之前)
                      AUTO_ENTRIES="$AUTO_ENTRIES" awk '
                        BEGIN { entries = ENVIRON["AUTO_ENTRIES"] }
                        /^<!--/ && !inserted { print entries; print ""; inserted = 1 }
                        { print }
                      ' docs/ReleaseBody.md > docs/ReleaseBody.md.tmp && mv docs/ReleaseBody.md.tmp docs/ReleaseBody.md
                      CHANGES="$(grep -F "（v$VER）" docs/ReleaseBody.md || true)"
                      AUTO_EXTRACTED="1"
                    fi
                  fi
                fi
              fi
              echo ""
              echo "---"
              echo ""
              if [[ -n "$CHANGES" ]]; then
                echo "## 本次更新"
                echo ""
                if [[ -n "$AUTO_EXTRACTED" ]]; then
                  echo "> docs/ReleaseBody.md 未预置 v$VER 条目，以下变更由发布流程自动提取自提交历史"
                  echo ""
                fi
                echo "$CHANGES"
              else
                echo "> ℹ️ 未在 docs/ReleaseBody.md 中找到 v$VER 的变更记录，完整更新历史见仓库文档"
              fi
              # 静态「程序说明」属于使用说明而非版本日志, 保持附带
              NOTES="$(awk '/^### 程序说明/{f=1} f' docs/ReleaseBody.md || true)"
              if [[ -n "$NOTES" ]]; then
                echo ""
                echo "---"
                echo ""
                echo "$NOTES"
              fi
            fi
          } > release-notes.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="v$RELEASE_VERSION"
          TITLE="GitHubDesktop2Chinese v$RELEASE_VERSION"
          # 网络抖动时自动重试（上传支持 --clobber，重试安全）
          retry() {
            local max=$1
            shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [[ $attempt -ge $max ]] && return 1
              echo "::warning::命令失败(第 ${attempt} 次)，15 秒后重试: $*"
              sleep 15
            done
          }
          # 上传资产+更新说明(已存在场景); 定义一次, 正常路径与自愈路径共用
          publish() {
            retry 3 gh release upload "$VER" release/* --clobber
            retry 3 gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
          }
          if gh release view "$VER" >/dev/null 2>&1; then
            publish
          else
            if ! retry 3 gh release create "$VER" release/* --title "$TITLE" --notes-file release-notes.md; then
              # view 可能因网络错误误判为不存在, 而 create 实际已存在(already exists):
              # 此时转 上传+编辑 自愈, 避免"release 已建但资产/说明半成品"永久挂死
              echo "::warning::gh release create 失败, 按已存在场景转上传+编辑自愈"
              publish
            fi
          fi
