# GitHubDesktop2Chinese 统一 CI/CD 工作流
# 一个工作流完成：自动构建、质量与安全检查、失效检测/候选提取、Release 发布。
#
# ── 触发 ─────────────────────────────────────────────────────
#   推送 main         全平台构建 + 产物功能测试 + 质量与安全检查（不发布）
#   定时（每日北京时间上午 10:00 = UTC 02:00）
#                     扫描 GitHub Desktop 最新版 + 提取翻译候选 + 构建产物
#                     （仅当 json/src/third_party/CMake 有变更时才发布 Release）
#   PR                构建 + 质量与安全检查（不发布）
#   推送 tag v*       构建并发布（版本号取 tag）
#   手动触发 type=    auto     构建 + 质量 + 维护 + 发布（无变更则跳过发布）
#                     build    仅构建
#                     security 仅质量与安全扫描
#                     maintain 仅失效检测/候选提取
#                     release  构建 + 发布（始终发布）
#
# ── job 依赖关系 ─────────────────────────────────────────────
#   version（版本解析，无依赖）
#       ├── build（需 version，矩阵：windows-x64 / macos-universal / linux-x64）
#       └── release（需 version + build 全平台产物）
#   json-quality / tools-test / codeql / auto-maintain 相互独立、与上述并行
#
# ── 构建产物约定 ─────────────────────────────────────────────
#   编译输出  Windows: build/Release/GitHubDesktop2Chinese.exe（MSVC 多配置生成器）
#             macOS: build/GitHubDesktop2Chinese（通用二进制: x86_64 + arm64, 静态链接 OpenSSL）
#             Linux: build/GitHubDesktop2Chinese（单配置生成器）
#   Artifact  GitHubDesktop2Chinese-<平台>-<版本号|SHA>
#   发布资产  GitHubDesktop2Chinese.exe        — Windows x64（保留历史文件名，向后兼容）
#             GitHubDesktop2Chinese-macos-universal — macOS 通用二进制（Intel + Apple Silicon）
#             GitHubDesktop2Chinese-linux-x64  — Linux x86_64
#             localization.json                — 汉化映射（最新）
#
# ── 版本号规则 ───────────────────────────────────────────────
#   tag 触发     取 tag 版本（v1.2.5 → 1.2.5）
#   手动 version 使用输入值
#   auto/release/定时 未输入时自动升级补丁号（最新 v* tag +1）
#   push main     不发布，版本留空（产物名回退为 commit SHA）
#
# ── 稳定性设计 ───────────────────────────────────────────────
#   - runner 固定版本（ubuntu-24.04 / windows-2025 / macos-15-intel），CodeQL v4
#   - 所有 job 均设 timeout-minutes 上限
#   - 网络/配置类关键步骤内置超时与自动重试
#   - macOS 通用二进制在 macos-15-intel 上交叉编译 arm64, 不依赖容量紧张的 arm64 runner;
#     OpenSSL 双架构静态库、GitHub Desktop 安装包与提取结果均走 actions/cache

name: GitHubDesktop2Chinese

on:
  # 每日北京时间上午 10:00（UTC 02:00）
  schedule:
    - cron: "0 2 * * *"
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      type:
        description: "执行类型"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - build
          - security
          - maintain
          - release
      version:
        description: "发布版本号（不带 v 前缀，如 1.2.5；留空则自动升级补丁号）"
        required: false
        type: string

concurrency:
  group: ghdesktop2chinese-${{ github.ref }}
  # PR 场景取消陈旧构建(同 PR 连续 push 只保留最新); main/tag/定时发布不取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  security-events: write

env:
  BUILD_TYPE: Release
  EXE_NAME: GitHubDesktop2Chinese.exe
  ARTIFACT_PREFIX: GitHubDesktop2Chinese

jobs:
  # ═════════════════════════════════════════════════
  # 0. 解析版本号（构建与发布共用，无依赖）
  # ═════════════════════════════════════════════════
  version:
    name: 解析版本号
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 计算版本号与变更检测
        id: resolve
        shell: bash
        # 经 env 传递而非 ${{ }} 内插进脚本: 防止输入中的引号/换行构成脚本注入
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TYPE: ${{ github.event.inputs.type }}
        run: |
          set -euo pipefail
          VERSION=""
          LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"

          # 自上一个版本 tag 以来是否存在影响构建产物的变更（无 tag 视为有变更）
          if [[ -n "$LATEST_TAG" ]]; then
            BUILD_CHANGES="$(git diff --name-only "${LATEST_TAG}..HEAD" -- \
              json src third_party CMakeLists.txt CMakePresets.json | wc -l | tr -d ' ')"
          else
            BUILD_CHANGES=1
          fi
          if [[ "$BUILD_CHANGES" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 ${LATEST_TAG} 以来无构建相关变更，auto/定时模式将跳过发布"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "使用 tag 版本: $VERSION"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            INPUT="$INPUT_VERSION"
            TYPE="$INPUT_TYPE"
            if [[ -n "$INPUT" ]]; then
              VERSION="${INPUT#v}"
              echo "使用手动输入版本: $VERSION"
            elif [[ "$TYPE" == "auto" || "$TYPE" == "release" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              LATEST="$LATEST_TAG"
              if [[ -z "$LATEST" ]]; then
                echo "本仓库暂无 v* tag，回落上游最新版本"
                # 网络失败不直接终止(set -e/pipefail), 交由下方统一检查给出友好报错
                LATEST="$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 15 --max-time 60 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  https://api.github.com/repos/cngege/GitHubDesktop2Chinese/releases/latest \
                  | jq -r '.tag_name')" || LATEST=""
              fi
              if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
                echo "::error::无法确定基础版本号，请手动输入 version"
                exit 1
              fi
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              PATCH="${PATCH:-0}"
              VERSION="$MAJOR.$MINOR.$((PATCH+1))"
              echo "自动升级版本: $LATEST -> v$VERSION"
            fi
          fi
          # 版本号格式校验(写入 GITHUB_OUTPUT 前):
          # 非法输入如 abc 会让下轮自动 bump 算出非法 tag(abc..1), 使每日定时发布链路瘫痪
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VERSION'（须为 x.y.z 纯数字，如 1.2.23；tag 与手动输入同此规则）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════
  # 1. 构建矩阵（Windows x64 / macOS Intel / macOS Apple Silicon / Linux x64）
  #    每平台编译 + 产物功能测试（--help / 非法参数拒绝 / 中文路径完整流程）
  #    触发：push main / tag / PR / 定时 / 手动(auto/build/release)
  # ═════════════════════════════════════════════════
  build:
    name: 构建 (${{ matrix.name }})
    needs: version
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'build' || inputs.type == 'release'))
    strategy:
      # 单平台失败不取消其余平台: 一次运行尽可能拿到全部平台结果
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            artifact: GitHubDesktop2Chinese.exe
          - name: macos-universal
            os: macos-15-intel
            artifact: GitHubDesktop2Chinese-macos-universal
          - name: linux-x64
            os: ubuntu-24.04
            artifact: GitHubDesktop2Chinese-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libssl-dev; }

      - name: 读取 OpenSSL 版本 (macOS)
        if: runner.os == 'macOS'
        id: osslver
        shell: bash
        run: |
          set -euo pipefail
          VER="$(brew info --json=v2 openssl@3 | jq -r '.formulae[0].versions.stable')"
          [[ "$VER" =~ ^3\.[0-9]+\.[0-9]+$ ]] || { echo "::error::OpenSSL 版本号异常: $VER"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "静态库构建使用 OpenSSL $VER 源码"

      - name: 缓存 macOS 静态 OpenSSL (x64 + arm64)
        if: runner.os == 'macOS'
        id: ossl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/ossl-x64
            ~/ossl-arm64
          key: openssl-static-${{ steps.osslver.outputs.version }}-${{ runner.arch }}

      - name: 构建 macOS 静态 OpenSSL (双架构, 缓存未命中时)
        if: runner.os == 'macOS' && steps.ossl-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          OSSL_VER: ${{ steps.osslver.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/openssl/openssl/releases/download/openssl-${OSSL_VER}/openssl-${OSSL_VER}.tar.gz"
          TMP="$(mktemp -d)"
          echo "下载 $URL"
          curl -fsSL --retry 3 --retry-delay 5 -o "$TMP/openssl.tar.gz" "$URL"
          # arm64 产物最低支持 macOS 11; 双架构部署目标一致, 保证通用二进制最低版本统一
          export MACOSX_DEPLOYMENT_TARGET=11.0
          build_ossl() {
            local arch="$1" target="$2"
            local src="$TMP/openssl-${OSSL_VER}-$arch" prefix="$HOME/ossl-$arch"
            mkdir -p "$src"
            # 每个架构独立解压源码树, 避免异构配置产物互相污染(perlasm 生成的汇编按架构不同)
            tar -xzf "$TMP/openssl.tar.gz" -C "$src" --strip-components=1
            (
              cd "$src"
              # no-zlib: 静态链接后不引入 zlib 依赖(仅影响已废弃的 TLS 压缩, 不影响正常 HTTPS)
              ./Configure "$target" no-shared no-tests no-apps no-zlib --prefix="$prefix" --openssldir="$prefix/ssl"
              make -j"$(sysctl -n hw.ncpu)" build_libs
              make install_dev
            )
            [[ -f "$prefix/lib/libssl.a" && -f "$prefix/lib/libcrypto.a" ]] || { echo "::error::OpenSSL $arch 静态库缺失"; exit 1; }
            echo "OpenSSL $arch 完成: $prefix"
          }
          build_ossl x64 darwin64-x86_64-cc
          build_ossl arm64 darwin64-arm64-cc

      - name: 组装 macOS 通用静态 OpenSSL
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          UNIV="$HOME/ossl-univ"
          rm -rf "$UNIV"
          mkdir -p "$UNIV/lib"
          # 头文件两架构一致, 取 x64 一份
          cp -R "$HOME/ossl-x64/include" "$UNIV/include"
          for lib in libssl libcrypto; do
            lipo -create "$HOME/ossl-x64/lib/$lib.a" "$HOME/ossl-arm64/lib/$lib.a" -output "$UNIV/lib/$lib.a"
            lipo -info "$UNIV/lib/$lib.a"
          done

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          $ver = if ($env:RELEASE_VERSION) { "v$env:RELEASE_VERSION" } else { "ci-${{ github.sha }}" }
          # CMake 配置含第三方库下载，网络抖动时自动重试
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake -B build -A x64 -DGitHubActions=1 "-DFILE_VERSION=$ver"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { Write-Error "CMake 配置连续失败 3 次"; exit 1 }
            Write-Warning "CMake 配置失败(第 $attempt 次)，15 秒后重试"
            Start-Sleep -Seconds 15
          }

      - name: Configure CMake (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="${RELEASE_VERSION:+v$RELEASE_VERSION}"
          VER="${VER:-ci-${GITHUB_SHA}}"
          EXTRA=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # 通用二进制(Intel + Apple Silicon): 交叉编译 arm64 + 静态链接通用 OpenSSL, 产物自包含不依赖 brew;
            # 部署目标 11.0 为 arm64 产物下限, 双架构一致
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64")
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
            EXTRA+=("-DOPENSSL_ROOT_DIR=$HOME/ossl-univ")
            EXTRA+=("-DOPENSSL_USE_STATIC_LIBS=TRUE")
          fi
          for attempt in 1 2 3; do
            if cmake -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DGitHubActions=1 "-DFILE_VERSION=$VER" ${EXTRA[@]+"${EXTRA[@]}"}; then
              break
            fi
            [[ $attempt -ge 3 ]] && { echo "::error::CMake 配置连续失败 3 次"; exit 1; }
            echo "::warning::CMake 配置失败(第 $attempt 次)，15 秒后重试"
            sleep 15
          done

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --build build --config "$BUILD_TYPE"
          else
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
            cmake --build build --config "$BUILD_TYPE" -j "$JOBS"
          fi

      - name: 产物功能测试
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="build/Release/${EXE_NAME}"
          else
            # macOS 通用二进制在本 Intel runner 上以 x86_64 切片原生跑功能测试;
            # arm64 切片由后续架构/自包含断言校验(同一 SDK/clang 交叉编译)
            BIN="build/GitHubDesktop2Chinese"
          fi
          [[ -f "$BIN" ]] || { echo "::error::未找到构建产物 $BIN"; exit 1; }

          echo "== 测试1: --help 应 exit 0 =="
          "$BIN" --help > /dev/null
          echo "OK"

          echo "== 测试2: 非法参数应被拒绝(exit!=0) =="
          if "$BIN" thisargdoesnotexist > /dev/null 2>&1; then
            echo "::error::非法参数未被拒绝"
            exit 1
          fi
          echo "OK"

          echo "== 测试3: 中文路径 + EOF 完整汉化流程应 exit 0 =="
          FIXTURE="$RUNNER_TEMP/汉化测试目录"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          printf '<html></html>' > "$FIXTURE/index.html"
          printf '// fixture main\n' > "$FIXTURE/main.js"
          printf '// fixture renderer\n' > "$FIXTURE/renderer.js"
          set +e
          OUT="$(echo "" | "$BIN" -g "$FIXTURE" --nopause 2>&1)"
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            echo "$OUT"
            echo "::error::完整流程 exit=$CODE"
            exit 1
          fi
          grep -q "renderer.js 文件汉化结束" <<< "$OUT" || { echo "$OUT"; echo "::error::流程未到达 renderer 汉化完成"; exit 1; }
          echo "OK"

      - name: macOS 架构与自包含断言
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="build/GitHubDesktop2Chinese"
          echo "== 架构检查(lipo) =="
          INFO="$(lipo -info "$BIN")"
          echo "$INFO"
          grep -q "x86_64" <<< "$INFO" || { echo "::error::产物缺少 x86_64 架构"; exit 1; }
          grep -q "arm64" <<< "$INFO" || { echo "::error::产物缺少 arm64 架构"; exit 1; }
          echo "== 自包含检查(不得依赖非系统动态库) =="
          otool -L "$BIN"
          # universal 二进制的 otool 输出含 "(architecture xxx):" 头行, 只检查 tab/空格缩进的依赖条目行
          if otool -L "$BIN" | grep '^[[:space:]]' | grep -Ev '(/usr/lib/|/System/)'; then
            echo "::error::产物仍依赖非系统动态库(如 brew 路径), 自包含校验失败"
            exit 1
          fi
          echo "OK"

      - name: 准备发布文件名
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "build/Release/${EXE_NAME}" "dist/${{ matrix.artifact }}"
          else
            cp build/GitHubDesktop2Chinese "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi
          ls -l dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.name }}-${{ needs.version.outputs.version || github.sha }}
          if-no-files-found: error
          path: dist/

  # ═════════════════════════════════════════════════
  # 2. localization.json 质量校验
  # ═════════════════════════════════════════════════
  json-quality:
    name: localization.json 质量校验
    # push main/tag 分支: 发布(release needs 本任务)在推 tag 场景同样受本质量门约束; push main 仅验证不发布
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 深度校验 localization.json
        run: |
          python - <<'PY'
          import json, re, sys

          sys.stdout.reconfigure(encoding="utf-8")

          path = "json/localization.json"
          raw = open(path, encoding="utf-8").read()
          data = json.loads(raw)

          errors = []
          warnings = []

          if "【待翻译】" in raw:
              errors.append("存在未替换的草稿占位符【待翻译】，请补全译文后再提交")

          for key in ["version", "minversion"]:
              if key not in data:
                  errors.append(f"缺少节点: {key}")

          for key in ["main", "renderer", "main_dev", "renderer_dev"]:
              if key not in data:
                  errors.append(f"缺少节点: {key}")
              elif not isinstance(data[key], list):
                  errors.append(f"{key} 应为数组, 实际为 {type(data[key]).__name__}")

          def check_array(name, arr):
              seen = {}
              # std::regex 不兼容语法黑名单(JS 认但 C++ 会抛 regex_error, 失效检测无法覆盖)
              blacklist = [
                  (r"\(\?<=", "后行断言 (?<=)"),
                  (r"\(\?<!", "负后行断言 (?<!)"),
                  (r"\(\?<[A-Za-z_]", "命名分组 (?<name>)"),
                  (r"\(\?P[<a-zA-Z]", "Python 命名分组 (?P<name>)"),
                  (r"\\p\{", r"Unicode 属性转义 \p{...}"),
                  (r"\(\?[a-zA-Z]+[):]", "内联 flag (?i:...)"),
              ]
              for i, item in enumerate(arr):
                  if not isinstance(item, list):
                      errors.append(f"{name}[{i}] 不是数组")
                      continue
                  if len(item) < 2 or len(item) > 3:
                      errors.append(f"{name}[{i}] 长度应为 2 或 3，实际 {len(item)}")
                      continue
                  if not all(isinstance(x, str) for x in item):
                      errors.append(f"{name}[{i}] 含非字符串元素")
                      continue
                  pat = item[0]
                  if not pat or pat == '""':
                      continue  # 空串与 "" 占位(应用侧视为跳过)不参与校验
                  for rx, why in blacklist:
                      if re.search(rx, pat):
                          errors.append(f"{name}[{i}] std::regex 不兼容语法({why}): {pat!r}")
                  try:
                      re.compile(pat)
                  except re.error as e:
                      errors.append(f"{name}[{i}] 非法正则: {pat!r} -> {e}")
                  if pat in seen:
                      warnings.append(f"{name} 重复查找项: {pat!r} (index {seen[pat]} 与 {i})")
                  else:
                      seen[pat] = i
                  # ReDoS 启发式(仅告警不阻断): 嵌套量词(如 (a+)+ 、 (.*x)* )在长文本上可能灾难性回溯卡死加载器
                  if re.search(r"\([^()]*[+*][^()]*\)\s*[+*{]", pat):
                      warnings.append(f"{name}[{i}] 疑似灾难性回溯(嵌套量词), 请改写该正则: {pat!r}")
                  # 译文问句风格: 去掉尾部引号后以 半角? 收尾且 ? 前为汉字 → 建议全角？
                  # (JS 三元/正则语法的 ? 不满足"以 ? 收尾"或 ? 前非汉字, 不会误报)
                  t = item[1].rstrip("\"'")
                  if t.endswith("?") and re.search(r"[一-鿿]\?$", t):
                      warnings.append(f"{name}[{i}] 译文以半角 ? 结尾, 建议改全角？: {item[1]!r}")

          for key in ["main", "renderer", "main_dev", "renderer_dev"]:
              if isinstance(data.get(key), list):
                  check_array(key, data[key])

          selects = data.get("select", [])
          if not isinstance(selects, list):
              errors.append(f"select 应为数组, 实际为 {type(selects).__name__}")
          else:
              for si, sel in enumerate(selects):
                  if not isinstance(sel, dict):
                      errors.append(f"select[{si}] 应为对象")
                      continue
                  if "replaceFile" not in sel:
                      errors.append(f"select[{si}] 缺少 replaceFile")
                  if "tooltip" not in sel:
                      errors.append(f"select[{si}] 缺少 tooltip")
                  if "enable" not in sel:
                      errors.append(f"select[{si}] 缺少 enable")
                  if "replaceFile" in sel and not isinstance(sel["replaceFile"], str):
                      errors.append(f"select[{si}] replaceFile 应为字符串")
                  if "tooltip" in sel and not isinstance(sel["tooltip"], str):
                      errors.append(f"select[{si}] tooltip 应为字符串")
                  if "enable" in sel and not isinstance(sel["enable"], bool):
                      errors.append(f"select[{si}] enable 应为布尔")
                  # 应用侧按字面量精确匹配这两个取值, 其它值整条 select 不生效(静默跳过)
                  if isinstance(sel.get("replaceFile"), str) and sel["replaceFile"] not in ("main.js", "renderer.js"):
                      errors.append(f"select[{si}] replaceFile 取值非法: {sel['replaceFile']!r}（仅允许 'main.js' / 'renderer.js'）")
                  if not isinstance(sel.get("replace"), list):
                      errors.append(f"select[{si}] replace 应为数组")

          print(f"映射项统计: main={len(data.get('main', []))} renderer={len(data.get('renderer', []))}")
          if warnings:
              print(f"\n⚠️  {len(warnings)} 个警告:")
              for w in warnings[:20]:
                  print(f"  - {w}")
          if errors:
              print(f"\n❌ {len(errors)} 个错误:")
              for e in errors[:30]:
                  print(f"  - {e}")
              sys.exit(1)
          print("\n✅ localization.json 质量校验通过")
          PY

  # ═════════════════════════════════════════════════
  # 3. 自动维护工具自检（语法 + 单元测试）
  # ═════════════════════════════════════════════════
  tools-test:
    name: 自动维护工具自检
    # push main/tag 分支: 保证发布(release needs 本任务)前工具自检已通过; push main 仅验证不发布
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'maintain' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 语法检查
        working-directory: tools/auto-maintain
        run: |
          for f in src/*.js; do node --check "$f"; done
          echo "所有源文件语法检查通过"

      - name: 单元测试（提取过滤 + 草稿生成逻辑）
        working-directory: tools/auto-maintain
        run: |
          node --input-type=module -e "
          import { isLikelyUiText, buildDraftLine } from './src/extract-new.js';
          import { renderMarkdown } from './src/report.js';
          const cases = [
            ['Do not show this message again', true],
            ['into ', false],
            ['  leading space', false],
            ['h:mm aaa', false],
            ['[object Object]', false],
            ['rgba(255, 255, 255, 0.3)', false],
            ['GitHub Desktop', true],
          ];
          let pass = 0;
          for (const [s, exp] of cases) {
            const got = isLikelyUiText(s);
            if (got !== exp) { console.error('FAIL:', JSON.stringify(s), 'got', got, 'exp', exp); process.exit(1); }
            pass++;
          }
          // 草稿行必须是合法 JSON，且查找项按字面量匹配
          for (const text of ['GitHub Desktop', 'Checkout commit?', 'No usage limit']) {
            const outer = JSON.parse('[' + buildDraftLine(text) + ']');
            const entry = outer[0];
            if (!Array.isArray(entry) || entry.length !== 2 || !entry.every(x => typeof x === 'string')) {
              console.error('FAIL: draft 非法', text); process.exit(1);
            }
            if (!new RegExp(entry[0]).test('\"' + text + '\"')) {
              console.error('FAIL: draft 模式匹配不到字面量', text); process.exit(1);
            }
            pass++;
          }
          // 报告体积防护: 大表应截断且总长不超 Issue 上限
          const fakeFailed = Array.from({ length: 1000 }, (_, i) => ({ array: 'renderer', index: i, item: [], errors: [{ reason: 'not-found', pattern: 'pattern-' + i }] }));
          const big = renderMarkdown({ version: 't', generatedAt: 't', checks: { total: 1000, ok: 0, failedCount: 1000, failed: fakeFailed }, candidates: { candidates: [], patternsCount: 0 } });
          if (!big.includes('其余 850 条失效项未展示')) { console.error('FAIL: 失效表截断说明缺失'); process.exit(1); }
          if (big.length >= 65536) { console.error('FAIL: 报告超出体积上限', big.length); process.exit(1); }
          pass++;
          console.log('单元测试通过:', pass, '项');
          "

  # ═════════════════════════════════════════════════
  # 4. CodeQL 安全扫描（PR / push main / 手动 auto|security，不含定时以节省资源）
  # ═════════════════════════════════════════════════
  codeql:
    name: CodeQL 安全扫描
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security'))
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # cpp 语言查询包不支持 overlay-base 增量分析，显式关闭以避免构建回退告警
      CODEQL_OVERLAY_DATABASE_MODE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="codeql"

      - name: Build for CodeQL
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"

  # ═════════════════════════════════════════════════
  # 5. 自动维护（失效检测 + 候选提取 → 创建/更新 Issue）
  #    触发：定时 / 手动(auto|maintain)
  # ═════════════════════════════════════════════════
  auto-maintain:
    name: 失效检测 + 未翻译候选提取
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain'))
    runs-on: ubuntu-24.04
    # 检测步骤 2×20min 重试 + 版本查询最坏约 6.5min, 需覆盖完整重试设计(30min 会把第二次重试 cancel 掉)
    timeout-minutes: 50
    env:
      # fetch.js 查询 GitHub API 时使用；匿名限额 60 次/小时会被共享 runner IP 触发 403
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 安装解压工具（缺失时）
        run: |
          command -v unzip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y unzip; }

      - name: 查询 GitHub Desktop 最新版本
        id: version
        working-directory: tools/auto-maintain
        run: |
          set -euo pipefail
          LATEST=""
          for attempt in 1 2 3; do
            if LATEST="$(timeout 120 node -e "import('./src/fetch.js').then(async m=>{const r=await m.getLatestRelease();console.log(r.version)}).catch(e=>{console.error(e.message);process.exit(1)})")"; then
              break
            fi
            echo "::warning::查询 GitHub Desktop 最新版本失败(第 ${attempt} 次)，10 秒后重试"
            sleep 10
          done
          [[ -n "$LATEST" ]] || { echo "::error::查询 GitHub Desktop 最新版本连续失败 3 次"; exit 1; }
          echo "ghdesktop_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "查询到 GitHub Desktop 最新版本: $LATEST"

      - name: 缓存安装包与提取结果
        id: cache-maintain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ghdesktop-auto-maintain
          # key 只含 安装包/解压产物 的实际决定因素(GHD 版本/平台/工具源码);
          # 不含 localization.json: 映射每次改动都作废 307MB 安装包缓存, 而报告由步骤内重新生成
          key: ghd-maintain-v3-${{ steps.version.outputs.ghdesktop_version }}-${{ runner.os }}-${{ hashFiles('tools/auto-maintain/src/**') }}

      - name: 运行失效检测 + 未翻译候选提取
        working-directory: tools/auto-maintain
        run: |
          set -euo pipefail
          attempt=0
          until timeout 1200 node src/index.js check extract \
            --workdir "$RUNNER_TEMP/ghdesktop-auto-maintain" \
            --top 100 \
            --write-report; do
            attempt=$((attempt + 1))
            if [[ $attempt -ge 2 ]]; then
              echo "::error::失效检测连续失败 2 次"
              exit 1
            fi
            echo "::warning::失效检测失败(第 ${attempt} 次)，20 秒后重试"
            sleep 20
          done

      - name: 创建或更新自动维护 Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              const fs = require('fs');
              const path = require('path');
              const reportPath = path.join(process.env.RUNNER_TEMP, 'ghdesktop-auto-maintain', 'report.md');
              const report = fs.readFileSync(reportPath, 'utf8');

              const failedMatch = report.match(/总映射项\s+(\d+)，有效\s+(\d+)，失效\s+(\d+)。/);
              if (!failedMatch) {
                // 报告文案与本正则强耦合: 解析失败时若静默降级, 自动关单/标题计数会永久失效且无告警
                core.warning('report.md 中未找到失效统计行(总映射项 x，有效 x，失效 x。), 失效数按 ? 处理, 请检查 report.js 文案是否变更');
              }
              const failed = failedMatch ? failedMatch[3] : '?';
              const noFailures = Number(failed) === 0;

              const title = `[自动维护] 汉化映射失效 ${failed} 项 / 未翻译候选 (GitHub Desktop 报告)`;
              const today = new Date().toISOString().slice(0, 10);
              const body = [
                `## 自动维护报告（${today}）`,
                '',
                '本 Issue 由自动维护工作流生成，用于提醒维护者关注汉化映射的健康度。',
                '',
                '> ⚠️ 此报告不直接修改 `localization.json`，请人工确认后处理。',
                '',
                '---',
                '',
                report,
                '',
                '---',
                `_由 [GitHubDesktop2Chinese](https://github.com/${{ github.repository }}/actions/workflows/ghdesktop2chinese.yml) 自动生成_`,
              ].join('\n');

              // 正文超长防护: GitHub Issue body 上限 65536 字符, 超限会导致创建/更新失败(恰在最需要报告时丢失)
              const MAX_BODY = 60000;
              const finalBody = body.length > MAX_BODY
                ? body.slice(0, MAX_BODY) + '\n\n> ⚠️ 报告过长，已截断；完整内容见工作流日志。\n'
                : body;

              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: ['auto-maintain'],
              });

              const existing = issues.find(i => i.title.startsWith('[自动维护]'));

              if (noFailures) {
                if (existing) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    state: 'closed',
                    body: finalBody,
                  });
                  console.log(`已关闭 Issue #${existing.number}（无失效项）`);
                } else {
                  console.log('无失效项且无历史 Issue，无需操作');
                }
                return;
              }

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: title,
                  body: finalBody,
                });
                console.log(`已更新 Issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: finalBody,
                  labels: ['auto-maintain'],
                });
                console.log(`已创建 Issue #${created.data.number}`);
              }
            } catch (err) {
              core.setFailed(`创建或更新自动维护 Issue 失败: ${err.message}`);
            }

  # ═════════════════════════════════════════════════
  # 6. 发布 Release（tag v* / 手动 auto|release / 定时且有变更）
  #    依赖 build 产物与 version 版本号
  # ═════════════════════════════════════════════════
  release:
    name: 发布 Release
    # json-quality/tools-test 与 release 同属任务门: 发布前强制过质量门与工具自检
    # (二者 if 已覆盖 push tag / dispatch release / schedule 分支, 不会出现 needs 悬空)
    needs: [version, build, json-quality, tools-test]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'auto' && needs.version.outputs.changed == 'true') ||
      (github.event_name == 'schedule' && needs.version.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 校验版本号
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          if [[ -z "$VER" ]]; then
            echo "::error::版本号为空，无法发布。请检查 version 任务输出"
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VER'（须为 x.y.z），拒绝发布"
            exit 1
          fi
          echo "发布版本: v$VER"

      - name: 下载全部构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # GitHubDesktop2Chinese-<平台>-<版本|SHA>（windows-x64 / macos-universal / linux-x64）
          pattern: ${{ env.ARTIFACT_PREFIX }}-*-${{ needs.version.outputs.version || github.sha }}
          path: release/
          merge-multiple: true

      - name: 准备 localization.json
        run: |
          set -euo pipefail
          mkdir -p release
          cp "json/localization.json" release/

      - name: 生成 Release 说明
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          {
            echo "# GitHubDesktop2Chinese v$VER"
            echo ""
            echo "自动构建产物："
            echo "- \`GitHubDesktop2Chinese.exe\` — Windows x64（64 位 Windows）"
            echo "- \`GitHubDesktop2Chinese-macos-universal\` — macOS 通用二进制（Intel 与 Apple Silicon 通用）"
            echo "- \`GitHubDesktop2Chinese-linux-x64\` — Linux x86_64"
            echo "- \`localization.json\` — 汉化映射（最新）"
            echo ""
            echo "## 使用方法"
            echo "1. 下载对应平台的程序文件直接运行，自动联网获取最新 \`localization.json\` 完成汉化"
            echo "2. 或将程序文件与 \`localization.json\` 放在同一文件夹运行"
            echo "3. GitHub Desktop 每次版本更新后需重新运行一次"
            echo ""
            echo "> ⚠️ 仅支持 64 位系统 / GitHub Desktop。macOS/Linux 首次运行请先 \`chmod +x\`；"
            echo "> Windows 找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable"
            if [[ -f docs/ReleaseBody.md ]]; then
              # 仅提取当前版本的变更行(行内含版本标记: 全角括号+vX.Y.Z),
              # 不再整篇附带从 v1.2.0 起的历史日志
              CHANGES="$(grep -F "（v$VER）" docs/ReleaseBody.md || true)"
              echo ""
              echo "---"
              echo ""
              if [[ -n "$CHANGES" ]]; then
                echo "## 本次更新"
                echo ""
                echo "$CHANGES"
              else
                echo "> ℹ️ 未在 docs/ReleaseBody.md 中找到 v$VER 的变更记录，完整更新历史见仓库文档"
              fi
              # 静态「程序说明」属于使用说明而非版本日志, 保持附带
              NOTES="$(awk '/^### 程序说明/{f=1} f' docs/ReleaseBody.md || true)"
              if [[ -n "$NOTES" ]]; then
                echo ""
                echo "---"
                echo ""
                echo "$NOTES"
              fi
            fi
          } > release-notes.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VER="v$RELEASE_VERSION"
          TITLE="GitHubDesktop2Chinese v$RELEASE_VERSION"
          # 网络抖动时自动重试（上传支持 --clobber，重试安全）
          retry() {
            local max=$1
            shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [[ $attempt -ge $max ]] && return 1
              echo "::warning::命令失败(第 ${attempt} 次)，15 秒后重试: $*"
              sleep 15
            done
          }
          if gh release view "$VER" >/dev/null 2>&1; then
            retry 3 gh release upload "$VER" release/* --clobber
            retry 3 gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
          else
            if ! retry 3 gh release create "$VER" release/* --title "$TITLE" --notes-file release-notes.md; then
              # view 可能因网络错误误判为不存在, 而 create 实际已存在(already exists):
              # 此时转 上传+编辑 自愈, 避免"release 已建但资产/说明半成品"永久挂死
              echo "::warning::gh release create 失败, 按已存在场景转上传+编辑自愈"
              retry 3 gh release upload "$VER" release/* --clobber
              retry 3 gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
            fi
          fi
