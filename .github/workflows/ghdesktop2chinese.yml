# GitHubDesktop2Chinese 统一 CI/CD 工作流
# 一个工作流完成：自动构建、质量与安全检查、失效检测/候选提取、Release 发布。
#
# ── 触发矩阵（自动 + 手动；与各 job 的 if 条件逐项对应）──────
#   触发场景               构建  质量/自检  CodeQL  维护  发布
#   push main              ✓    ✓         ✓      ✓     ✓（仅构建相关变更, 补丁号+1）
#   push tag v*            ✓    ✓         -(注1) -     ✓（版本=tag）
#   PR（目标 main）         ✓    ✓         ✓      -     -
#   定时 每日 UTC 02:13     ✓    ✓         -(注2) ✓     ✓（仅构建相关变更, 补丁号+1）
#   手动 build             ✓    -         -      -     -
#   手动 security          -    ✓         ✓      -     -
#   手动 maintain          -    ✓(仅自检) -      ✓     -
#   手动 auto              ✓    ✓         ✓      ✓     ✓（仅 main 且变更时）
#   手动 release           ✓    ✓         ✓      ✓     ✓（仅 main, 始终发布）
#   注1: tag 提交已在 push main 扫描过, 不重复跑 CodeQL
#   注2: 定时不含 CodeQL（节省资源, 由 PR / push main 覆盖）
#   注3: fork PR 不跑 CodeQL（其令牌无 security-events 写权限, 上传必失败）
#   防重复: push 仅绑定 main 与 tag → PR 分支的推送不会二次触发(PR 由 pull_request 单路径负责);
#           同一 PR 连续推送由 concurrency 取消陈旧运行
#   边界:   发布类(auto/release)仅限 main 触发(防特性分支误发布); 其他 ref 可跑 build/security/maintain 排查
#
# ── jobs 总览与依赖 ─────────────────────────────────────────
#   0. version        解析版本号与变更检测（构建/发布类任务的前置）
#   1. json-quality   localization.json 数据质量门
#   2. tools-test     自动维护工具自检门（语法 + 单元测试 + Markdown 链接检查）
#   3. codeql         C/C++ 安全扫描门
#   4. build          构建矩阵(三平台四目标) + 产物功能测试
#   5. auto-maintain  失效检测 + 未翻译候选提取（定时 / 手动）
#   6. release        汇总产物并发布
#
#   job 依赖: build←version；release←version+build+json-quality+tools-test
#             json-quality / tools-test / codeql / auto-maintain 相互独立，与 build 并行
#
# ── 构建产物约定 ─────────────────────────────────────────────
#   编译输出  Windows: build/Release/GitHubDesktop2Chinese.exe（MSVC 多配置生成器）
#             macOS: build/GitHubDesktop2Chinese（通用二进制: x86_64 + arm64, 静态链接 OpenSSL）
#             Linux: build/GitHubDesktop2Chinese（单配置生成器）
#   Artifact  GitHubDesktop2Chinese-<平台>-<版本号|SHA>
#   发布资产  GitHubDesktop2Chinese.exe        — Windows x64（保留历史文件名，向后兼容）
#             GitHubDesktop2Chinese-macos-x64   — macOS Intel（x64）
#             GitHubDesktop2Chinese-macos-arm64 — macOS Apple Silicon（M 系列）
#             GitHubDesktop2Chinese-linux-x64  — Linux x86_64
#             localization.json                — 汉化映射（最新）
#
# ── 版本号规则 ───────────────────────────────────────────────
#   tag 触发     取 tag 版本（v1.2.5 → 1.2.5）
#   手动 version 使用输入值
#   auto/release/定时 未输入时自动升级补丁号（最新 v* tag +1）
#   push main     有构建相关变更时自动补丁号+1 发布；无变更不发布（版本留空, 产物名回退 commit SHA）
#
# ── 稳定性设计 ───────────────────────────────────────────────
#   - runner 固定版本（ubuntu-24.04 / windows-2025 / macos-15-intel），CodeQL v4
#   - 所有 job 均设 timeout-minutes 上限
#   - 网络/配置类关键步骤内置超时与自动重试
#   - macOS 拆分 macos-x64 / macos-arm64 单架构包, 均在 macos-15-intel 交叉编译(不依赖容量紧张的 arm64 runner),
#     静态 OpenSSL + strip/LTO 裁剪体积; OpenSSL 双架构静态库、GitHub Desktop 安装包与提取结果均走 actions/cache
#   - 第三方 actions 全部按 commit SHA 固定（版本升级手动执行；漏洞告警由 Dependabot 提示）
#   - 数据质量校验/工具自检/维护报告等大型脚本外置于 tools/ci（YAML 仅保留调用）
#   - 发布产物生成构建溯源证明（SLSA provenance attestation），可用 gh attestation verify 校验来源

name: GitHubDesktop2Chinese

# 触发配置（执行矩阵见文件头注释；各 job 的 if 条件与矩阵逐项对应）
on:
  # 推送 main（校验；有构建相关变更时自动补丁发版）/ 推送 tag v*（构建并发布, 版本号取 tag）
  push:
    branches:
      - main
    tags:
      - "v*"
  # PR: 仅目标分支为 main 时触发（边界: 其他目标分支不执行, 避免无意义消耗）
  pull_request:
    branches:
      - main
  # 每日北京时间 10:13 = UTC 02:13: 构建 + 质量 + 维护, 有构建相关变更时发布
  # 分钟取 13 避开整点: GitHub Actions 高负载时段(整点开始)定时任务会被延迟甚至丢弃(官方文档),
  # 实测整点 cron 曾延迟 6.5 小时/次日被丢弃; schedule 本身是尽力而为, 准点不保证
  schedule:
    - cron: "13 2 * * *"
  # 手动触发（建议在 main 上执行; 发布类 auto/release 仅 main 生效, 见 release job 边界注释）
  workflow_dispatch:
    inputs:
      type:
        description: "执行类型: auto=构建+质量+维护+发布 | build=仅构建 | security=仅质量与安全扫描 | maintain=仅失效检测/候选提取 | release=构建+发布"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - build
          - security
          - maintain
          - release
      version:
        description: "版本号（不带 v 前缀, 如 1.2.5; 留空自动升级补丁号; 仅对 build/auto/release 的产物命名与发布生效）"
        required: false
        type: string

concurrency:
  group: ghdesktop2chinese-${{ github.ref }}
  # PR 场景取消陈旧构建(同 PR 连续 push 只保留最新); main/tag/定时发布不取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认最小权限：读代码；issues 供自动维护写报告；security-events 供 CodeQL 上传结果
permissions:
  contents: read
  issues: write
  security-events: write

# 全局变量：构建类型 / 可执行文件名 / 产物名前缀
env:
  BUILD_TYPE: Release
  EXE_NAME: GitHubDesktop2Chinese.exe
  ARTIFACT_PREFIX: GitHubDesktop2Chinese

jobs:
  # ═════════════════════════════════════════════════
  # 0. 解析版本号（构建与发布共用，无依赖）
  # ═════════════════════════════════════════════════
  version:
    name: 解析版本号
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 计算版本号与变更检测
        id: resolve
        shell: bash
        # 经 env 传递而非 ${{ }} 内插进脚本: 防止输入中的引号/换行构成脚本注入
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TYPE: ${{ github.event.inputs.type }}
        run: |
          set -euo pipefail
          VERSION=""
          LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"

          # 自上一个版本 tag 以来是否存在影响构建产物的变更（无 tag 视为有变更）
          # third_party/README.md 为纯文档(政策说明), 排除以免文档性修改误触发自动发版
          if [[ -n "$LATEST_TAG" ]]; then
            BUILD_CHANGES="$(git diff --name-only "${LATEST_TAG}..HEAD" -- \
              json src third_party CMakeLists.txt CMakePresets.json \
              ':(exclude)third_party/README.md' | wc -l | tr -d ' ')"
          else
            BUILD_CHANGES=1
          fi
          if [[ "$BUILD_CHANGES" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 ${LATEST_TAG} 以来无构建相关变更，push main/auto/定时模式将跳过发布"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "使用 tag 版本: $VERSION"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            INPUT="$INPUT_VERSION"
            TYPE="$INPUT_TYPE"
            if [[ -n "$INPUT" ]]; then
              VERSION="${INPUT#v}"
              echo "使用手动输入版本: $VERSION"
            # push main: 仅当存在构建相关变更时自动补丁发版(无变更不发布, 版本留空回退 SHA)
            elif [[ "$TYPE" == "auto" || "$TYPE" == "release" || "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "push" && "$BUILD_CHANGES" -gt 0 ) ]]; then
              LATEST="$LATEST_TAG"
              if [[ -z "$LATEST" ]]; then
                echo "本仓库暂无 v* tag，回落上游最新版本"
                # 网络失败不直接终止(set -e/pipefail), 交由下方统一检查给出友好报错
                LATEST="$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 15 --max-time 60 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  https://api.github.com/repos/cngege/GitHubDesktop2Chinese/releases/latest \
                  | jq -r '.tag_name')" || LATEST=""
              fi
              if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
                echo "::error::无法确定基础版本号，请手动输入 version"
                exit 1
              fi
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              PATCH="${PATCH:-0}"
              VERSION="$MAJOR.$MINOR.$((PATCH+1))"
              echo "自动升级版本: $LATEST -> v$VERSION"
            fi
          fi
          # 版本号格式校验(写入 GITHUB_OUTPUT 前):
          # 非法输入如 abc 会让下轮自动 bump 算出非法 tag(abc..1), 使每日定时发布链路瘫痪
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VERSION'（须为 x.y.z 纯数字，如 1.2.23；tag 与手动输入同此规则）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════
  # 1. localization.json 质量门（结构 / 正则安全 / 译文风格）
  # ═════════════════════════════════════════════════
  json-quality:
    name: localization.json 质量校验
    # release needs 本任务: tag 推送与 push main 自动发版均受本质量门约束
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 深度校验 localization.json
        run: python tools/ci/check-localization.py

  # ═════════════════════════════════════════════════
  # 2. 自动维护工具自检门（语法 + 单元测试 + Markdown 链接检查）
  # ═════════════════════════════════════════════════
  tools-test:
    name: 自动维护工具自检
    # release needs 本任务: 保证 tag 推送与 push main 自动发版前工具自检已通过
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'maintain' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 语法检查
        working-directory: tools/auto-maintain
        run: |
          for f in src/*.js; do node --check "$f"; done
          echo "所有源文件语法检查通过"

      - name: 单元测试（提取过滤 + 草稿生成逻辑）
        run: node tools/ci/tools-self-test.mjs

      - name: Markdown 链接检查
        run: python tools/ci/md-check.py

  # ═════════════════════════════════════════════════
  # 3. CodeQL 安全扫描门（PR / push main / 手动 auto|security|release；不含定时以节省资源）
  # ═════════════════════════════════════════════════
  codeql:
    name: CodeQL 安全扫描
    # 触发: PR(仅同仓分支; fork PR 令牌无 security-events 写权限, 跳过避免上传必失败) / push main / 手动 auto|security|release
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # cpp 语言查询包不支持 overlay-base 增量分析，显式关闭以避免构建回退告警
      CODEQL_OVERLAY_DATABASE_MODE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DFILE_VERSION="codeql"

      - name: Build for CodeQL
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"

  # ═════════════════════════════════════════════════
  # 4. 构建矩阵（windows-x64 / macos-x64 / macos-arm64 / linux-x64）
  #    每平台编译 + 产物功能测试（--help / 非法参数拒绝 / 中文路径完整流程）
  #    macOS 两个单架构包均在 macos-15-intel 交叉编译（不依赖 arm64 runner）:
  #    静态链接 OpenSSL + strip/LTO 裁剪体积; arm64 由架构/自包含断言校验(无法原生执行)
  #    触发：push main|tag / PR / 定时 / 手动(auto|build|release)
  # ═════════════════════════════════════════════════
  build:
    name: 构建 (${{ matrix.name }})
    needs: version
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'build' || inputs.type == 'release'))
    strategy:
      # 单平台失败不取消其余平台: 一次运行尽可能拿到全部平台结果
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            artifact: GitHubDesktop2Chinese.exe
          - name: macos-x64
            os: macos-15-intel
            arch: x64
            artifact: GitHubDesktop2Chinese-macos-x64
          - name: macos-arm64
            os: macos-15-intel
            arch: arm64
            artifact: GitHubDesktop2Chinese-macos-arm64
          - name: linux-x64
            os: ubuntu-24.04
            artifact: GitHubDesktop2Chinese-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # 最小权限：读代码 + 为产物溯源证明申请 OIDC 签名（attestations）
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # ── 检出 ──
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── 平台依赖：Linux 系统 libssl-dev / macOS 双架构静态 OpenSSL（带缓存, 两个单架构包共用）──
      - name: 安装 OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          dpkg -s libssl-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libssl-dev; }

      - name: 读取 OpenSSL 版本 (macOS)
        if: runner.os == 'macOS'
        id: osslver
        shell: bash
        run: |
          set -euo pipefail
          VER="$(brew info --json=v2 openssl@3 | jq -r '.formulae[0].versions.stable')"
          [[ "$VER" =~ ^3\.[0-9]+\.[0-9]+$ ]] || { echo "::error::OpenSSL 版本号异常: $VER"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "静态库构建使用 OpenSSL $VER 源码"

      - name: 还原 macOS 静态 OpenSSL 缓存 (x64 + arm64)
        if: runner.os == 'macOS'
        id: ossl-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # path/key 与下方「保存」步骤共用 YAML 锚点（单一维护点，防两处漂移）
          path: &ossl_cache_paths |
            ~/ossl-x64
            ~/ossl-arm64
          key: &ossl_cache_key openssl-static-${{ steps.osslver.outputs.version }}-${{ runner.arch }}

      - name: 构建 macOS 静态 OpenSSL (双架构, 缓存未命中时)
        id: ossl-build
        if: runner.os == 'macOS' && steps.ossl-restore.outputs.cache-hit != 'true'
        shell: bash
        env:
          OSSL_VER: ${{ steps.osslver.outputs.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/openssl/openssl/releases/download/openssl-${OSSL_VER}/openssl-${OSSL_VER}.tar.gz"
          TMP="$(mktemp -d)"
          echo "下载 $URL"
          curl -fsSL --retry 3 --retry-delay 5 -o "$TMP/openssl.tar.gz" "$URL"
          # arm64 产物最低支持 macOS 11; 双架构部署目标一致, 保证通用二进制最低版本统一
          export MACOSX_DEPLOYMENT_TARGET=11.0
          build_ossl() {
            local arch="$1" target="$2"
            local src="$TMP/openssl-${OSSL_VER}-$arch" prefix="$HOME/ossl-$arch"
            mkdir -p "$src"
            # 每个架构独立解压源码树, 避免异构配置产物互相污染(perlasm 生成的汇编按架构不同)
            tar -xzf "$TMP/openssl.tar.gz" -C "$src" --strip-components=1
            (
              cd "$src"
              # no-zlib: 静态链接后不引入 zlib 依赖(仅影响已废弃的 TLS 压缩, 不影响正常 HTTPS)
              ./Configure "$target" no-shared no-tests no-apps no-zlib --prefix="$prefix" --openssldir="$prefix/ssl"
              make -j"$(sysctl -n hw.ncpu)" build_libs
              make install_dev
            )
            [[ -f "$prefix/lib/libssl.a" && -f "$prefix/lib/libcrypto.a" ]] || { echo "::error::OpenSSL $arch 静态库缺失"; exit 1; }
            echo "OpenSSL $arch 完成: $prefix"
          }
          build_ossl x64 darwin64-x86_64-cc
          build_ossl arm64 darwin64-arm64-cc

      - name: 保存 macOS 静态 OpenSSL 缓存
        # always(): 后续步骤(功能测试等)失败时也保住已构建的静态库, 避免下次运行重复 8 分钟构建;
        # 仅当本次确实执行且成功构建时保存(命中缓存或构建失败则不存)
        if: always() && runner.os == 'macOS' && steps.ossl-build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: *ossl_cache_paths
          key: *ossl_cache_key

      # ── 配置：CMake 生成（失败自动重试 3 次）──
      - name: 配置 CMake（Windows x64）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          $ver = if ($env:RELEASE_VERSION) { "v$env:RELEASE_VERSION" } else { "ci-${{ github.sha }}" }
          # CMake 配置无需联网（OpenSSL 静态库随仓库提交），环境抖动时自动重试
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake -B build -A x64 "-DFILE_VERSION=$ver"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { Write-Error "CMake 配置连续失败 3 次"; exit 1 }
            Write-Warning "CMake 配置失败(第 $attempt 次)，15 秒后重试"
            Start-Sleep -Seconds 15
          }

      - name: 配置 CMake（macOS/Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="${RELEASE_VERSION:+v$RELEASE_VERSION}"
          VER="${VER:-ci-${GITHUB_SHA}}"
          EXTRA=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # 单架构包(x64/arm64 由矩阵 arch 指定): 交叉编译 + 静态链接对应架构 OpenSSL, 产物自包含不依赖 brew;
            # 部署目标 11.0 为 arm64 产物下限; LTO 与打包后 strip 进一步压缩体积
            ARCH="${{ matrix.arch }}"
            CMAKE_ARCH="$ARCH"
            if [[ "$ARCH" == "x64" ]]; then CMAKE_ARCH="x86_64"; fi
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=$CMAKE_ARCH")
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
            EXTRA+=("-DOPENSSL_ROOT_DIR=$HOME/ossl-$ARCH")
            EXTRA+=("-DOPENSSL_USE_STATIC_LIBS=TRUE")
            EXTRA+=("-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE")
          fi
          for attempt in 1 2 3; do
            if cmake -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" "-DFILE_VERSION=$VER" ${EXTRA[@]+"${EXTRA[@]}"}; then
              break
            fi
            [[ $attempt -ge 3 ]] && { echo "::error::CMake 配置连续失败 3 次"; exit 1; }
            echo "::warning::CMake 配置失败(第 $attempt 次)，15 秒后重试"
            sleep 15
          done

      # ── 编译 ──
      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --build build --config "$BUILD_TYPE"
          else
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
            cmake --build build --config "$BUILD_TYPE" -j "$JOBS"
          fi

      # ── 产物验证：功能冒烟（x64 原生执行）+ macOS 架构/自包含断言 ──
      - name: 产物功能测试
        shell: bash
        run: |
          set -euo pipefail
          # macOS arm64 产物无法在 Intel runner 原生执行, 由后续架构/自包含断言覆盖(同一 SDK/clang 交叉编译)
          if [[ "$RUNNER_OS" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            echo "跳过: arm64 交叉产物无法在本 runner 原生运行"
            exit 0
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="build/Release/${EXE_NAME}"
          else
            BIN="build/GitHubDesktop2Chinese"
          fi
          [[ -f "$BIN" ]] || { echo "::error::未找到构建产物 $BIN"; exit 1; }

          echo "== 测试1: --help 应 exit 0 =="
          "$BIN" --help > /dev/null
          echo "OK"

          echo "== 测试2: 非法参数应被拒绝(exit!=0) =="
          if "$BIN" thisargdoesnotexist > /dev/null 2>&1; then
            echo "::error::非法参数未被拒绝"
            exit 1
          fi
          echo "OK"

          echo "== 测试3: 中文路径 + EOF 完整汉化流程应 exit 0 =="
          FIXTURE="$RUNNER_TEMP/汉化测试目录"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          printf '<html></html>' > "$FIXTURE/index.html"
          printf '// fixture main\n' > "$FIXTURE/main.js"
          printf '// fixture renderer\n' > "$FIXTURE/renderer.js"
          set +e
          OUT="$(echo "" | "$BIN" -g "$FIXTURE" --nopause 2>&1)"
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            echo "$OUT"
            echo "::error::完整流程 exit=$CODE"
            exit 1
          fi
          grep -q "renderer.js 文件汉化结束" <<< "$OUT" || { echo "$OUT"; echo "::error::流程未到达 renderer 汉化完成"; exit 1; }
          echo "OK"

      # ── 打包与归档：命名 → strip → 架构/自包含断言 → attestation → 上传 ──
      - name: 准备发布文件名
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "build/Release/${EXE_NAME}" "dist/${{ matrix.artifact }}"
          else
            cp build/GitHubDesktop2Chinese "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi
          ls -l dist/

      - name: macOS 裁剪符号 (strip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          BEFORE="$(stat -f%z "$BIN")"
          strip -x "$BIN"
          AFTER="$(stat -f%z "$BIN")"
          ls -l "$BIN"
          echo "strip 体积: $BEFORE -> $AFTER bytes"

      - name: macOS 架构与自包含断言
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          EXPECT="${{ matrix.arch }}"
          if [[ "$EXPECT" == "x64" ]]; then EXPECT="x86_64"; fi
          OPPOSITE="arm64"
          if [[ "$EXPECT" == "arm64" ]]; then OPPOSITE="x86_64"; fi
          echo "== 架构检查(应为单架构 $EXPECT) =="
          INFO="$(lipo -info "$BIN")"
          echo "$INFO"
          grep -q "$EXPECT" <<< "$INFO" || { echo "::error::产物缺少 $EXPECT 架构"; exit 1; }
          if grep -q "$OPPOSITE" <<< "$INFO"; then
            echo "::error::产物存在多余架构 $OPPOSITE(应为单架构包)"
            exit 1
          fi
          echo "== 自包含检查(不得依赖非系统动态库) =="
          otool -L "$BIN"
          if otool -L "$BIN" | grep '^[[:space:]]' | grep -Ev '(/usr/lib/|/System/)'; then
            echo "::error::产物仍依赖非系统动态库(如 brew 路径), 自包含校验失败"
            exit 1
          fi
          echo "OK"

      - name: 生成产物溯源证明（attestation）
        # PR 事件不执行：PR 的 id-token(OIDC) 权限受限（尤其 fork PR），且 PR 产物无需发布级溯源
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.artifact }}

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.name }}-${{ needs.version.outputs.version || github.sha }}
          if-no-files-found: error
          path: dist/

  # ═════════════════════════════════════════════════
  # 5. 自动维护（失效检测 + 候选提取 → 创建/更新 Issue）
  #    触发：push main / 定时 / 手动(auto|maintain|release)
  # ═════════════════════════════════════════════════
  auto-maintain:
    name: 失效检测 + 未翻译候选提取
    # 触发: push main(每次提交巡检映射健康度) / 定时 / 手动 auto|maintain|release; tag 与 PR 不触发
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    # 检测步骤 2×20min 重试 + 版本查询最坏约 6.5min, 需覆盖完整重试设计(30min 会把第二次重试 cancel 掉)
    timeout-minutes: 50
    env:
      # fetch.js 查询 GitHub API 时使用；匿名限额 60 次/小时会被共享 runner IP 触发 403
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 安装解压工具（缺失时）
        run: |
          command -v unzip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y unzip; }

      - name: 查询 GitHub Desktop 最新版本
        id: version
        working-directory: tools/auto-maintain
        run: |
          set -euo pipefail
          LATEST=""
          for attempt in 1 2 3; do
            if LATEST="$(timeout 120 node -e "import('./src/fetch.js').then(async m=>{const r=await m.getLatestRelease();console.log(r.version)}).catch(e=>{console.error(e.message);process.exit(1)})")"; then
              break
            fi
            echo "::warning::查询 GitHub Desktop 最新版本失败(第 ${attempt} 次)，10 秒后重试"
            sleep 10
          done
          [[ -n "$LATEST" ]] || { echo "::error::查询 GitHub Desktop 最新版本连续失败 3 次"; exit 1; }
          echo "ghdesktop_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "查询到 GitHub Desktop 最新版本: $LATEST"

      - name: 缓存安装包与提取结果
        id: cache-maintain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ghdesktop-auto-maintain
          # key 只含 安装包/解压产物 的实际决定因素(GHD 版本/平台/工具源码);
          # 不含 localization.json: 映射每次改动都作废 307MB 安装包缓存, 而报告由步骤内重新生成
          key: ghd-maintain-v3-${{ steps.version.outputs.ghdesktop_version }}-${{ runner.os }}-${{ hashFiles('tools/auto-maintain/src/**') }}

      - name: 运行失效检测 + 未翻译候选提取
        working-directory: tools/auto-maintain
        run: |
          set -euo pipefail
          attempt=0
          until timeout 1200 node src/index.js check extract \
            --workdir "$RUNNER_TEMP/ghdesktop-auto-maintain" \
            --top 100 \
            --write-report; do
            attempt=$((attempt + 1))
            if [[ $attempt -ge 2 ]]; then
              echo "::error::失效检测连续失败 2 次"
              exit 1
            fi
            echo "::warning::失效检测失败(第 ${attempt} 次)，20 秒后重试"
            sleep 20
          done

      - name: 创建或更新自动维护 Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./tools/ci/report-issue.js');
            await run({ github, context, core });

  # ═════════════════════════════════════════════════
  # 6. 发布 Release（push main 有变更 / tag v* / 手动 auto|release / 定时且有变更）
  #    依赖 build 产物与 version 版本号
  # ═════════════════════════════════════════════════
  release:
    name: 发布 Release
    # json-quality/tools-test 与 release 同属任务门: 发布前强制过质量门与工具自检
    # (二者 if 已覆盖 push tag / dispatch release / schedule 分支, 不会出现 needs 悬空)
    needs: [version, build, json-quality, tools-test]
    # 发布边界: push main 仅在存在构建相关变更时自动补丁发版; 手动 auto/release 仅限 main(防特性分支误发布)
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.type == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.type == 'auto' && needs.version.outputs.changed == 'true') ||
      (github.event_name == 'schedule' && needs.version.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      # SignPath 签名后需对签名产物重新生成构建溯源证明(OIDC)
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      # SignPath 代码签名(Foundation 免费开源证书): token 与组织 ID 齐备才签名, 缺任一则跳过
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 校验版本号
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          if [[ -z "$VER" ]]; then
            echo "::error::版本号为空，无法发布。请检查 version 任务输出"
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VER'（须为 x.y.z），拒绝发布"
            exit 1
          fi
          echo "发布版本: v$VER"
          # 版本漂移检查: 并发排队时 version 在排队前计算, 发布时最新 tag 可能已前进;
          # 正常情况下最新 tag 应为 v<x.y.(z-1)>, 不一致仅告警不阻断(记录实际对应关系)
          LATEST_TAG="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n1 || true)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          if [[ -n "$LATEST_TAG" && "$PATCH" -gt 0 ]]; then
            EXPECT_PREV="v${MAJOR}.${MINOR}.$((PATCH-1))"
            if [[ "$LATEST_TAG" != "$EXPECT_PREV" ]]; then
              echo "::warning::版本漂移: 当前最新 tag 为 ${LATEST_TAG}, 预期 ${EXPECT_PREV}; 本次实际发布 v${VER}"
            else
              echo "版本链正常: 最新 tag ${LATEST_TAG} -> v${VER}"
            fi
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # GitHubDesktop2Chinese-<平台>-<版本|SHA>（windows-x64 / macos-universal / linux-x64）
          pattern: ${{ env.ARTIFACT_PREFIX }}-*-${{ needs.version.outputs.version || github.sha }}
          path: release/
          merge-multiple: true

      - name: 准备 localization.json
        run: |
          set -euo pipefail
          mkdir -p release
          cp "json/localization.json" release/

      - name: 上传待签名 Windows 产物
        # SignPath 前置要求: 待签名文件须先作为 GitHub artifact 上传(v4+), 以 artifact-id 提交签名请求
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows-${{ needs.version.outputs.version || github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: release/GitHubDesktop2Chinese.exe

      - name: SignPath 代码签名（Windows exe）
        # SignPath Foundation 免费开源代码签名; project/policy slug 可用仓库 variables 覆盖
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'GitHubDesktop2Chinese' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: 替换为已签名 Windows 产物
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          set -euo pipefail
          test -f signed/GitHubDesktop2Chinese.exe
          cp signed/GitHubDesktop2Chinese.exe release/GitHubDesktop2Chinese.exe
          echo "已用 SignPath 签名产物替换 release/GitHubDesktop2Chinese.exe"

      - name: 为签名产物重新生成构建溯源证明
        # build 任务的 attestation 绑定未签名 exe 摘要, 签名后内容已变;
        # 对签名产物重新 attest, 保证 release 资产可通过 gh attestation verify 校验
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/GitHubDesktop2Chinese.exe

      - name: 生成 Release 说明
        shell: bash
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          {
            echo "# GitHubDesktop2Chinese v$VER"
            echo ""
            echo "自动构建产物："
            echo "- \`GitHubDesktop2Chinese.exe\` — Windows x64（64 位 Windows）"
            echo "- \`GitHubDesktop2Chinese-macos-x64\` — macOS Intel（x64）"
            echo "- \`GitHubDesktop2Chinese-macos-arm64\` — macOS Apple Silicon（M 系列）"
            echo "- \`GitHubDesktop2Chinese-linux-x64\` — Linux x86_64"
            echo "- \`localization.json\` — 汉化映射（最新）"
            echo ""
            echo "> 产物附带构建溯源证明，可校验来源：\`gh attestation verify <下载的文件> --repo Tupig/GitHubDesktop2Chinese\`"
            if [[ -n "${SIGNPATH_API_TOKEN:-}" && -n "${SIGNPATH_ORGANIZATION_ID:-}" ]]; then
              echo "> Windows 产物已通过 [SignPath](https://signpath.org) 代码签名"
            fi
            echo ""
            echo "## 使用方法"
            echo "1. 下载对应平台的程序文件直接运行，自动联网获取最新 \`localization.json\` 完成汉化"
            echo "2. 或将程序文件与 \`localization.json\` 放在同一文件夹运行"
            echo "3. GitHub Desktop 每次版本更新后需重新运行一次"
            echo ""
            echo "> ⚠️ 仅支持 64 位系统 / GitHub Desktop。macOS/Linux 首次运行请先 \`chmod +x\`；"
            echo "> Windows 找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable"
            if [[ -f docs/ReleaseBody.md ]]; then
              # 仅提取当前版本的变更行(行内含版本标记: 全角括号+vX.Y.Z),
              # 不再整篇附带从 v1.2.0 起的历史日志
              CHANGES="$(grep -F "（v$VER）" docs/ReleaseBody.md || true)"
              echo ""
              echo "---"
              echo ""
              if [[ -n "$CHANGES" ]]; then
                echo "## 本次更新"
                echo ""
                echo "$CHANGES"
              else
                echo "> ℹ️ 未在 docs/ReleaseBody.md 中找到 v$VER 的变更记录，完整更新历史见仓库文档"
              fi
              # 静态「程序说明」属于使用说明而非版本日志, 保持附带
              NOTES="$(awk '/^### 程序说明/{f=1} f' docs/ReleaseBody.md || true)"
              if [[ -n "$NOTES" ]]; then
                echo ""
                echo "---"
                echo ""
                echo "$NOTES"
              fi
            fi
          } > release-notes.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="v$RELEASE_VERSION"
          TITLE="GitHubDesktop2Chinese v$RELEASE_VERSION"
          # 网络抖动时自动重试（上传支持 --clobber，重试安全）
          retry() {
            local max=$1
            shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [[ $attempt -ge $max ]] && return 1
              echo "::warning::命令失败(第 ${attempt} 次)，15 秒后重试: $*"
              sleep 15
            done
          }
          if gh release view "$VER" >/dev/null 2>&1; then
            retry 3 gh release upload "$VER" release/* --clobber
            retry 3 gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
          else
            if ! retry 3 gh release create "$VER" release/* --title "$TITLE" --notes-file release-notes.md; then
              # view 可能因网络错误误判为不存在, 而 create 实际已存在(already exists):
              # 此时转 上传+编辑 自愈, 避免"release 已建但资产/说明半成品"永久挂死
              echo "::warning::gh release create 失败, 按已存在场景转上传+编辑自愈"
              retry 3 gh release upload "$VER" release/* --clobber
              retry 3 gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
            fi
          fi
