# GitHubDesktop2Chinese 统一 CI/CD 工作流
# 一个工作流完成：自动构建、安全与质量检查、失效检测/候选提取、Release 发布。
#
# 触发：
#   - PR → 构建 + 安全质量（不发布）
#   - 推送 tag v*（如 v1.2.5）→ 构建并发布 Release
#   - 手动触发（type 选择执行子集）：
#       auto     构建 + 质量 + 维护 + 发布（版本号自动升级；若无变更则跳过发布）
#       build    仅构建
#       security 仅质量与安全扫描
#       maintain 仅失效检测/候选提取
#       release  构建 + 发布（版本号自动升级或手动指定，始终发布）
#
# 版本号规则：
#   - tag 触发：取 tag 版本（v1.2.5 → 1.2.5）
#   - 手动输入 version：使用输入值
#   - 未输入：自动升级补丁号（本仓库最新 v* tag 基础上 +1；无 tag 时回落上游最新版本）
#
# 发布规则：
#   - 仅支持 64 位（x64）
#   - tag 推送与 type=release：始终发布
#   - type=auto：自上個版本 tag 以来 json/src/third_party/CMake 无变更时跳过发布
#
# 说明：为避免自动消耗 Actions 额度，定时任务已移除，
# 全部改为 PR 触发或手动触发。

name: GitHubDesktop2Chinese

on:
  pull_request:
    paths:
      - "**"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      type:
        description: "执行类型"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - build
          - security
          - maintain
          - release
      version:
        description: "发布版本号（不带 v 前缀，如 1.2.5；留空则自动升级补丁号）"
        required: false
        type: string

concurrency:
  group: ghdesktop2chinese-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  security-events: write

env:
  BUILD_TYPE: Release
  PROJECT_DIR: .
  WORK_DIR: /tmp/ghdesktop-auto-maintain

jobs:
  # ─────────────────────────────────────────────
  # 0. 解析版本号（构建与发布共用）
  # ─────────────────────────────────────────────
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 计算版本号
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          VERSION=""
          LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"

          # 自上一个版本 tag 以来是否存在影响构建产物的变更（无 tag 视为有变更）
          if [[ -n "$LATEST_TAG" ]]; then
            BUILD_CHANGES="$(git diff --name-only "${LATEST_TAG}..HEAD" -- \
              json src third_party CMakeLists.txt CMakePresets.json | wc -l | tr -d ' ')"
          else
            BUILD_CHANGES=1
          fi
          if [[ "$BUILD_CHANGES" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 ${LATEST_TAG} 以来无构建相关变更，auto 模式将跳过 Release"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "使用 tag 版本: $VERSION"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            INPUT='${{ github.event.inputs.version }}'
            TYPE='${{ github.event.inputs.type }}'
            if [[ -n "$INPUT" ]]; then
              VERSION="${INPUT#v}"
              echo "使用手动输入版本: $VERSION"
            elif [[ "$TYPE" == "auto" || "$TYPE" == "release" ]]; then
              LATEST="$LATEST_TAG"
              if [[ -z "$LATEST" ]]; then
                echo "本仓库暂无 v* tag，回落上游最新版本"
                LATEST="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  https://api.github.com/repos/cngege/GitHubDesktop2Chinese/releases/latest \
                  | jq -r '.tag_name')"
              fi
              if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
                echo "::error::无法确定基础版本号，请手动输入 version"
                exit 1
              fi
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              PATCH="${PATCH:-0}"
              VERSION="$MAJOR.$MINOR.$((PATCH+1))"
              echo "自动升级版本: $LATEST -> v$VERSION"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # 1. 构建（仅 64 位 x64）
  # 触发：tag / PR / 手动(auto/build/release)
  # ─────────────────────────────────────────────
  build:
    name: 构建 (x64)
    needs: version
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'build' || inputs.type == 'release'))
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          $ver = if ($env:RELEASE_VERSION) { "v$env:RELEASE_VERSION" } else { "ci-${{ github.sha }}" }
          cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="$ver"

      - name: Build (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config $env:BUILD_TYPE

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: GitHubDesktop2Chinese-x64-${{ github.sha }}
          if-no-files-found: error
          path: build/Release/GitHubDesktop2Chinese.exe

  # ─────────────────────────────────────────────
  # 2. localization.json 质量校验
  # ─────────────────────────────────────────────
  json-quality:
    name: localization.json 质量校验
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 深度校验 localization.json
        run: |
          python - <<'PY'
          import json, re, sys

          sys.stdout.reconfigure(encoding="utf-8")

          path = "json/localization.json"
          raw = open(path, encoding="utf-8").read()
          data = json.loads(raw)

          errors = []
          warnings = []

          if "【待翻译】" in raw:
              errors.append("存在未替换的草稿占位符【待翻译】，请补全译文后再提交")

          for key in ["version", "minversion", "main", "renderer", "main_dev", "renderer_dev"]:
              if key not in data:
                  errors.append(f"缺少节点: {key}")

          def check_array(name, arr):
              seen = {}
              for i, item in enumerate(arr):
                  if not isinstance(item, list):
                      errors.append(f"{name}[{i}] 不是数组")
                      continue
                  if len(item) < 2 or len(item) > 3:
                      errors.append(f"{name}[{i}] 长度应为 2 或 3，实际 {len(item)}")
                      continue
                  if not all(isinstance(x, str) for x in item):
                      errors.append(f"{name}[{i}] 含非字符串元素")
                      continue
                  pat = item[0]
                  if not pat:
                      continue
                  try:
                      re.compile(pat)
                  except re.error as e:
                      errors.append(f"{name}[{i}] 非法正则: {pat!r} -> {e}")
                  if pat in seen:
                      warnings.append(f"{name} 重复查找项: {pat!r} (index {seen[pat]} 与 {i})")
                  else:
                      seen[pat] = i

          for key in ["main", "renderer", "main_dev", "renderer_dev"]:
              if isinstance(data.get(key), list):
                  check_array(key, data[key])

          for si, sel in enumerate(data.get("select", [])):
              if "replaceFile" not in sel:
                  errors.append(f"select[{si}] 缺少 replaceFile")
              if not isinstance(sel.get("replace"), list):
                  errors.append(f"select[{si}] replace 应为数组")

          print(f"映射项统计: main={len(data.get('main', []))} renderer={len(data.get('renderer', []))}")
          if warnings:
              print(f"\n⚠️  {len(warnings)} 个警告:")
              for w in warnings[:20]:
                  print(f"  - {w}")
          if errors:
              print(f"\n❌ {len(errors)} 个错误:")
              for e in errors[:30]:
                  print(f"  - {e}")
              sys.exit(1)
          print("\n✅ localization.json 质量校验通过")
          PY

  # ─────────────────────────────────────────────
  # 3. 自动维护工具自检（语法 + 单元测试）
  # ─────────────────────────────────────────────
  tools-test:
    name: 自动维护工具自检
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'maintain'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 语法检查
        working-directory: tools/auto-maintain
        run: |
          for f in src/*.js; do node --check "$f"; done
          echo "所有源文件语法检查通过"

      - name: 单元测试（提取过滤 + 草稿生成逻辑）
        working-directory: tools/auto-maintain
        run: |
          node --input-type=module -e "
          import { isLikelyUiText, buildDraftLine } from './src/extract-new.js';
          const cases = [
            ['Do not show this message again', true],
            ['into ', false],
            ['  leading space', false],
            ['h:mm aaa', false],
            ['[object Object]', false],
            ['rgba(255, 255, 255, 0.3)', false],
            ['GitHub Desktop', true],
          ];
          let pass = 0;
          for (const [s, exp] of cases) {
            const got = isLikelyUiText(s);
            if (got !== exp) { console.error('FAIL:', JSON.stringify(s), 'got', got, 'exp', exp); process.exit(1); }
            pass++;
          }
          // 草稿行必须是合法 JSON，且查找项按字面量匹配
          for (const text of ['GitHub Desktop', 'Checkout commit?', 'No usage limit']) {
            const outer = JSON.parse('[' + buildDraftLine(text) + ']');
            const entry = outer[0];
            if (!Array.isArray(entry) || entry.length !== 2 || !entry.every(x => typeof x === 'string')) {
              console.error('FAIL: draft 非法', text); process.exit(1);
            }
            if (!new RegExp(entry[0]).test('\"' + text + '\"')) {
              console.error('FAIL: draft 模式匹配不到字面量', text); process.exit(1);
            }
            pass++;
          }
          console.log('单元测试通过:', pass, '项');
          "

  # ─────────────────────────────────────────────
  # 4. CodeQL 安全扫描
  # ─────────────────────────────────────────────
  codeql:
    name: CodeQL 安全扫描
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="codeql"

      - name: Build for CodeQL
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  # ─────────────────────────────────────────────
  # 5. 自动维护（失效检测 + 候选提取，创建 Issue）
  # ─────────────────────────────────────────────
  auto-maintain:
    name: 失效检测 + 未翻译候选提取
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 安装解压工具
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: 查询 GitHub Desktop 最新版本
        id: version
        working-directory: tools/auto-maintain
        run: |
          LATEST=$(node -e "import('./src/fetch.js').then(async m=>{const r=await m.getLatestRelease();console.log(r.version)})")
          echo "ghdesktop_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "查询到 GitHub Desktop 最新版本: $LATEST"

      - name: 缓存 GitHub Desktop Windows 完整包
        id: cache-zip
        uses: actions/cache@v6
        with:
          path: ${{ env.WORK_DIR }}/github-desktop.nupkg
          key: ghdesktop-win-${{ steps.version.outputs.ghdesktop_version }}-${{ runner.os }}

      - name: 运行失效检测 + 未翻译候选提取
        working-directory: tools/auto-maintain
        run: |
          node src/index.js check extract \
            --workdir "$WORK_DIR" \
            --top 100 \
            --write-report

      - name: 创建或更新自动维护 Issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join(process.env.WORK_DIR, 'report.md');
            const report = fs.readFileSync(reportPath, 'utf8');

            const failedMatch = report.match(/总映射项\s+(\d+)，有效\s+(\d+)，失效\s+(\d+)。/);
            const failed = failedMatch ? failedMatch[3] : '?';
            const noFailures = Number(failed) === 0;

            const title = `[自动维护] 汉化映射失效 ${failed} 项 / 未翻译候选 (GitHub Desktop 报告)`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `## 自动维护报告（${today}）`,
              '',
              '本 Issue 由自动维护工作流生成，用于提醒维护者关注汉化映射的健康度。',
              '',
              '> ⚠️ 此报告不直接修改 `localization.json`，请人工确认后处理。',
              '',
              '---',
              '',
              report,
              '',
              '---',
              `_由 [GitHubDesktop2Chinese](https://github.com/${{ github.repository }}/actions/workflows/ghdesktop2chinese.yml) 自动生成_`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['auto-maintain'],
            });

            const existing = issues.find(i => i.title.startsWith('[自动维护]'));

            if (noFailures) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  body: body,
                });
                console.log(`已关闭 Issue #${existing.number}（无失效项）`);
              } else {
                console.log('无失效项且无历史 Issue，无需操作');
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body,
              });
              console.log(`已更新 Issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['auto-maintain'],
              });
              console.log(`已创建 Issue #${created.data.number}`);
            }

  # ─────────────────────────────────────────────
  # 6. 发布 Release（tag v* 或手动 auto/release）
  # 依赖 build（需其产物）与 version（版本号）
  # auto 模式下若自上个版本以来无构建相关变更，则跳过发布
  # ─────────────────────────────────────────────
  release:
    name: 发布 Release
    needs: [version, build]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'auto' && needs.version.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 校验版本号
        run: |
          VER="${{ needs.version.outputs.version }}"
          if [[ -z "$VER" ]]; then
            echo "::error::版本号为空，无法发布。请检查 version 任务输出"
            exit 1
          fi
          echo "发布版本: v$VER"

      - name: 下载构建产物 (x64)
        uses: actions/download-artifact@v8
        with:
          name: GitHubDesktop2Chinese-x64-${{ github.sha }}
          path: release/

      - name: 准备 localization.json
        run: |
          mkdir -p release
          cp "json/localization.json" release/

      - name: 生成 Release 说明
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          {
            echo "# GitHubDesktop2Chinese v$VER"
            echo ""
            echo "自动构建产物："
            echo "- \`GitHubDesktop2Chinese.exe\` — 64 位（仅支持 64 位 Windows）"
            echo "- \`localization.json\` — 汉化映射（最新）"
            echo ""
            echo "## 使用方法"
            echo "1. 下载 \`GitHubDesktop2Chinese.exe\` 双击运行，自动联网获取最新 \`localization.json\` 完成汉化"
            echo "2. 或下载 exe 与 \`localization.json\` 放在同一文件夹运行"
            echo "3. GitHub Desktop 每次版本更新后需重新运行一次"
            echo ""
            echo "> ⚠️ 仅支持 64 位 Windows / GitHub Desktop；找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable"
            if [[ -f docs/ReleaseBody.md ]]; then
              echo ""
              echo "---"
              echo ""
              cat docs/ReleaseBody.md
            fi
          } > release-notes.md

      - name: 创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v${{ needs.version.outputs.version }}"
          TITLE="GitHubDesktop2Chinese v${{ needs.version.outputs.version }}"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" \
              release/GitHubDesktop2Chinese.exe \
              release/localization.json \
              --clobber
            gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$VER" \
              release/GitHubDesktop2Chinese.exe \
              release/localization.json \
              --title "$TITLE" \
              --notes-file release-notes.md
          fi
