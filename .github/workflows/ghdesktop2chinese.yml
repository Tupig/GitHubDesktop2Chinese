# GitHubDesktop2Chinese 统一 CI/CD 工作流
# 一个工作流完成：自动构建、质量与安全检查、失效检测/候选提取、Release 发布。
#
# ── 触发矩阵（自动 + 手动；与各 job 的 if 条件逐项对应）──────
#   触发场景               构建      质量自检   安全/维护门   产库  发布
#   push main              ✓(注4)   ✓         ✓            -     ✓（仅构建相关变更, 补丁号+1）
#   push tag v*            ✓        ✓         ✓(空跑,注1)  -     ✓（版本=tag）
#   PR（目标 main）         ✓        ✓         ✓(注3)       ✓(注5) -
#   定时 每日 UTC 01:23    ✓(注4)   ✓         ✓(注2)       -     ✓（仅构建相关变更, 补丁号+1）
#                                                ↳ 失败时 CI 失败通知 Issue(注8)
#   OpenSSL 定时 UTC 02:00  -        -         ✓(注9)       ✓     -
#   手动 build             ✓        -         -            -     -
#   手动 security          -        ✓         ✓            -     -
#   手动 maintain          -        ✓         ✓(维护块)    -     -
#   手动 vendor            -        -         -            ✓(注6) -
#   手动 auto              ✓        ✓         ✓            -     ✓（仅 main 且变更时）
#   手动 release           ✓        ✓         ✓            -     ✓（仅 main, 始终发布）
#   注1: tag 提交已在 push main 扫描过, CodeqlScan 任务级条件含 tag 仅为保证 Release 的
#        needs 不被悬空(块内四组步骤条件均不含 tag → 空跑成功, 不耗扫描资源)
#   注2: 定时不跑 CodeQL 块（节省资源, 由 PR / push main 覆盖）, 仅跑自动维护块
#   注3: fork PR 不跑 CodeQL 块（其令牌无 security-events 写权限, 上传必失败）
#   注4: 构建差异检测(#81): 定时与 push main 且"无待发布变更"时, 若与上次成功构建
#        的构建相关路径也无差异 → 跳过四平台构建矩阵, 由 CodeqlScan 的构建跳过说明块输出说明;
#        PR(质量门每次须验证)/tag(连着发布)/手动触发(尊重用户意图)始终构建
#   注5: PR 打 vendor-openssl 标签触发 labeled 事件, 单次产库四连并行产库;
#        labeled 运行取消同 PR 进行中的常规运行, 完成后重跑 PR 常规检查;
#        移除后重加标签可重新产库
#   注6: 手动 vendor 经 openssl-version 输入指定版本(留空自动取 3.5 LTS 系列最新 patch, 注7), 与常规运行共享
#        concurrency 组(产库期间 push main 排队)
#   注7: 产库版本强制跟随 openssl/openssl 3.5 LTS 系列最新 patch(供应链; 官方政策
#        openssl-library.org/policies/releasestrat: 3.5 为 LTS 支持至 2030-04, 4.0 非 LTS 不采纳):
#        四连全部成功后 OpensslVendorPR 校验所产版本 == 3.5 LTS 系列最新, 否则拒绝开入库 PR
#   注8: 定时构建失败通知(#131): 任一任务失败时 CiNotify 创建/更新单条 "[CI 失败]"
#        Issue(连续失败计数, 恢复后自动关闭); 仅限定时触发——push/PR 失败在 Actions/PR
#        页即时可见, 无需 Issue 渠道
#   注9: OpenSSL 版本定时检测(周一 UTC 02:00): 查 3.5 LTS 系列最新, 与仓库当前版本对比;
#        有新版本 → 自动触发产库并行矩阵 + 开入库 PR; 无新版本 → 跳过
#   防重复: push 仅绑定 main 与 tag → PR 分支的推送不会二次触发(PR 由 pull_request 单路径负责);
#           同一 PR 连续推送由 concurrency 取消陈旧运行
#   边界:   发布类(auto/release)仅限 main 触发(防特性分支误发布); 其他 ref 可跑 build/security/maintain/vendor 排查
#
# ── jobs 总览与依赖（13 任务, PascalCase 命名）────────────────
#   0. Version            解析版本号与变更检测（构建/发布类任务的前置）;
#                         构建差异检测: 与上次成功构建对比, 无差异时输出 build_changed=false
#   1. Build              构建矩阵(三平台四目标) Matrix build + 产物功能测试（无差异时跳过, 见注4）
#                         sccache 编译缓存加速增量构建
#   2. JsonCheck          质量校验门（json/编码/工具/md/工作流）
#                         （json 深度校验 + 源码编码格式检查 #88 + 自动维护工具语法/自测
#                          + Markdown 链接检查 + 单工作流规范校验 W0-W6 及校验器单测;
#                          合并原 json-quality / encoding-check / tools-test 三任务）
#   3. CodeqlScan         安全与维护门（保持 windows-2025 以扫描 _WIN32 代码分支, 四块独立控制）:
#                         ├ CodeQL 安全扫描（原 codeql, 增量扫描 + 数据库缓存）
#                         ├ 自动维护: 失效检测 + 候选提取（原 auto-maintain）
#                         ├ 同步 docs/wiki → GitHub Wiki（原 sync-wiki）
#                         └ 构建跳过说明（原 build-skip-notice, 见注4）
#   4. OpensslCheck       OpenSSL 版本定时检测（周一 UTC 02:00）: 查 3.5 LTS 系列最新 vs 仓库当前
#   5. OpensslLinux       产库 OpenSSL（linux x64 静态库; PR 标签 vendor-openssl / 手动 vendor / OpensslCheck 触发）
#   6. OpensslWin         产库 OpenSSL（windows x64 .lib; 同上触发, 产物用于替换内置库）
#   7. OpensslMacosArm64  产库 OpenSSL（macOS arm64 交叉编译; 同上触发, macos-15 原生 ARM）
#   8. OpensslMacosX64    产库 OpenSSL（macOS x64 交叉编译; 同上触发, macos-15-intel 原生 x64）
#   9. OpensslVerify      产库验证（四连全部成功后, 组装 third_party, 四平台矩阵构建验证新库可用）
#  10. OpensslVendorPR   产库自动开 PR（验证通过后组装 third_party 并自动开入库 PR,
#                         版本须为 3.5 LTS 系列最新 见注7; GITHUB_TOKEN PR 不触发 CI,
#                         由维护者按 PR 内审查清单确认后合并）
#  11. Release            汇总产物并发布
#  12. CiNotify           CI 失败通知（仅定时构建, #131）: 有失败 job 时创建/更新单条
#                         "[CI 失败]" Issue(连续失败计数), 成功时自动关闭; push/PR 失败
#                         在 Actions/PR 页即时可见, 不走本渠道
#
#   job 依赖: Version 为根; Build/JsonCheck ← Version; CodeqlScan ← Version+JsonCheck
#             (Version 直连为读其 outputs —— GitHub 仅直接 needs 可访问 outputs, 间接依赖不传递);
#             OpensslCheck ← CodeqlScan（定时检测, 依赖维护门通过）;
#             产库四连并行: OpensslLinux/Win/MacosArm64/MacosX64 均 ← CodeqlScan（不再串行依赖）,
#             以 always() + 原 vendor 触发条件串联(不受上游 skip/失败传导, 保持原独立产库语义与低频);
#             OpensslVerify ← 产库四连(四 result 全 success 才验证);
#             OpensslVendorPR ← 产库四连 + 验证(全 success 才开 PR);
#             Release ← Version+Build+JsonCheck+CodeqlScan(Version 直连同上; 其余三门为发布质量门);
#             CiNotify ← 全部 12 任务(!cancelled(): 失败也要跑, 通知的意义正在于失败)
#   图约束: 全图以 Version 为根连通, 无孤立/不连通任务、无循环、无悬空 needs,
#           needs 表达式引用须指向存在的直接依赖任务 —— 由 JsonCheck 的
#           单工作流规范校验（tools/ci/check-workflow.py, W0-W6）强制
#   链路保证: changed=true(有变更待发版)时 build_changed 恒为 true(强制构建),
#             Release 需要的产物永远存在; 无差异跳过只发生在 changed=false 时
#
# ── 构建产物约定 ─────────────────────────────────────────────
#   编译输出  Windows: build/Release/GitHubDesktop2Chinese.exe（MSVC 多配置生成器）
#             macOS: build/GitHubDesktop2Chinese（单架构二进制: x64 或 arm64, 静态链接 OpenSSL）
#             Linux: build/GitHubDesktop2Chinese（单配置生成器）
#   Artifact  GitHubDesktop2Chinese-<平台>-<版本号|SHA>
#   产库产物  openssl-linux-x64 / openssl-windows-x64 / openssl-macos-arm64 / openssl-macos-x64
#             （产库四连任务产出, 仅 include/+lib/, 保留 7 天; 由 OpensslVendorPR 自动下载组装
#              third_party/ 并开入库 PR, 不再人工下载提交）
#   发布资产  GitHubDesktop2Chinese.exe        — Windows x64（保留历史文件名，向后兼容）
#             GitHubDesktop2Chinese-macos-x64   — macOS Intel（x64）
#             GitHubDesktop2Chinese-macos-arm64 — macOS Apple Silicon（M 系列）
#             GitHubDesktop2Chinese-linux-x64  — Linux x86_64
#             localization.json                — 汉化映射（最新）
#
# ── 版本号规则 ───────────────────────────────────────────────
#   tag 触发     取 tag 版本（v0.0.1 → 0.0.1）
#   手动 version 使用输入值
#   auto/release/定时 未输入时自动递增版本（基于最新 v* tag，无 tag 自 v0.0.0 起步）:
#     patch +1; patch 满 100 进位 minor 并重置为 1（0.0.100 → 0.1.1）;
#     minor 满 100 进位 major 并重置为 0（0.100.100 → 1.0.1）
#   push main     有构建相关变更时自动递增版本发布；无变更不发布（版本留空, 产物名回退 commit SHA）
#
# ── 稳定性设计 ───────────────────────────────────────────────
#   - runner 固定版本（ubuntu-24.04 / windows-2025 / macos-15-intel / macos-15(arm64)），CodeQL v4
#   - 所有 job 均设 timeout-minutes 上限
#   - 网络/配置类关键步骤内置超时与自动重试
#   - macOS 拆分 macos-x64 / macos-arm64 单架构包: x64 在 macos-15-intel 原生构建,
#     arm64 在 macos-15(M1) 原生构建(产物功能测试可原生执行),
#     静态 OpenSSL + strip/LTO 裁剪体积; OpenSSL 静态库由产库四连任务产库(见 5/6/7/8),
#     sccache 编译缓存跨 run 复用(缓存至 GitHub Actions Cache)
#   - 第三方 actions 全部按 commit SHA 固定（版本升级手动执行；漏洞告警由 Dependabot 提示）
#   - 数据质量校验/工具自检/维护报告等大型脚本外置于 tools/ci（YAML 仅保留调用）
#   - 发布产物生成构建溯源证明（SLSA provenance attestation），可用 gh attestation verify 校验来源

name: GitHubDesktop2Chinese

# 触发配置（执行矩阵见文件头注释；各 job 的 if 条件与矩阵逐项对应）
on:
  # 推送 main（校验；有构建相关变更时自动补丁发版）/ 推送 tag v*（构建并发布, 版本号取 tag）
  push:
    branches:
      - main
    tags:
      - "v*"
  # PR: 仅目标分支为 main 时触发（边界: 其他目标分支不执行, 避免无意义消耗）
  # types 显式加 labeled: 配合 vendor-openssl 标签产库(见触发矩阵注5); labeled 运行会取消同 PR 进行中的常规运行
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  # 每日北京时间 09:23 = UTC 01:23: 构建 + 质量 + 维护, 有构建相关变更时发布
  # 分钟取 23 避开整点: GitHub Actions 高负载时段(整点开始)定时任务会被延迟甚至丢弃(官方文档),
  # 实测非整点 cron 仍可能延迟数小时/偶发丢失; schedule 本身是尽力而为, 准点不保证
  schedule:
    - cron: "23 1 * * *"
    # OpenSSL 版本定时检测: 每周一 UTC 02:00, 与每日构建错开避免资源竞争
    - cron: "0 2 * * 1"
  # OpenSSL 版本定时检测: 每周一 UTC 02:00（北京时间 10:00）, 查 3.5 LTS 系列最新 vs 仓库当前版本
  # 与每日构建错开, 避免同时段资源竞争; 有新版本时自动触发产库并行矩阵 + 开入库 PR
  workflow_dispatch:
    inputs:
      type:
        description: "执行类型: auto=构建+质量+维护+发布 | build=仅构建 | security=仅质量与安全扫描 | maintain=仅失效检测/候选提取 | vendor=仅产库OpenSSL | release=构建+发布"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - build
          - security
          - maintain
          - vendor
          - release
      openssl-version:
        description: "OpenSSL 产库版本（不带 v/openssl- 前缀, 如 3.5.9; 仅 type=vendor 生效; 留空自动取 3.5 LTS 系列最新）"
        required: false
        default: ""
        type: string
      version:
        description: "版本号（不带 v 前缀, 如 0.0.2; 留空自动递增版本; 仅对 build/auto/release 的产物命名与发布生效）"
        required: false
        type: string

concurrency:
  group: ghdesktop2chinese-${{ github.ref }}
  # PR 场景取消陈旧构建(同 PR 连续 push 只保留最新); main/tag/定时发布不取消
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 默认最小权限：读代码；issues 供自动维护写报告；security-events 供 CodeQL 上传结果
# 顶层默认最小权限；需要更高权限的 job 在各自 permissions 块显式声明（#117）
permissions:
  contents: read

# 全局变量：构建类型 / 可执行文件名 / 产物名前缀
env:
  BUILD_TYPE: Release
  EXE_NAME: GitHubDesktop2Chinese.exe
  ARTIFACT_PREFIX: GitHubDesktop2Chinese

jobs:
  # ═════════════════════════════════════════════════
  # 0. 解析版本号（构建与发布共用，无依赖）
  # ═════════════════════════════════════════════════
  Version:
    name: 解析版本号
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # gh api 查询 workflow runs（#81 构建差异检测）需要 actions 读权限，显式声明不依赖平台默认行为（#117）
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
      build_changed: ${{ steps.resolve.outputs.build_changed }}
      build_base: ${{ steps.resolve.outputs.build_base }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 计算版本号与变更检测
        id: resolve
        shell: bash
        # 经 env 传递而非 ${{ }} 内插进脚本: 防止输入中的引号/换行构成脚本注入
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TYPE: ${{ github.event.inputs.type }}
        run: |
          set -euo pipefail
          VERSION=""
          LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"

          # 构建相关路径白名单(单一维护点): 变更检测与构建差异检测共用;
          # third_party/README.md 为纯文档(政策说明), 排除以免文档性修改误触发自动发版
          PATHSPEC=(json src third_party CMakeLists.txt CMakePresets.json ':(exclude)third_party/README.md')
          # 自上一个版本 tag 以来是否存在影响构建产物的变更（无 tag 视为有变更）
          if [[ -n "$LATEST_TAG" ]]; then
            BUILD_CHANGES="$(git diff --name-only "${LATEST_TAG}..HEAD" -- "${PATHSPEC[@]}" | wc -l | tr -d ' ')"
          else
            BUILD_CHANGES=1
          fi
          if [[ "$BUILD_CHANGES" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 ${LATEST_TAG} 以来无构建相关变更，push main/auto/定时模式将跳过发布"
          fi

          # ── 构建差异检测(#81): 与上一次成功构建对比, 无差异则跳过四平台构建矩阵 ──
          # 仅"无待发布变更"的定时与 push main 评估跳过(省 runner 资源):
          #   changed=true 时恒为 true 强制构建, 保证 release 需要的产物永远存在;
          #   PR(质量门每次须验证)/tag(连着发布)/手动触发(尊重用户意图)始终构建
          BUILD_CHANGED="true"
          BUILD_BASE_SHA=""
          if [[ "$BUILD_CHANGES" -eq 0 && ( "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "main" ) ) ]]; then
            # 查询 main 分支最近一次成功 run 的 head SHA(本次 run 未结束, 不会匹配到自己;
            # tag run 的 head_branch 为 tag 名, 不会混入; API 失败则保持构建, fail-open)
            BUILD_BASE_SHA="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ghdesktop2chinese.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)"
            if [[ -n "$BUILD_BASE_SHA" && "$BUILD_BASE_SHA" != "null" ]]; then
              BUILD_DIFF="$(git diff --name-only "${BUILD_BASE_SHA}..HEAD" -- "${PATHSPEC[@]}" | wc -l | tr -d ' ')"
              if [[ "$BUILD_DIFF" -eq 0 ]]; then
                BUILD_CHANGED="false"
                echo "::notice::无差异，已跳过构建：当前 commit 与上次成功构建 ${BUILD_BASE_SHA:0:7} 的构建相关路径（json/ src/ third_party/ CMakeLists.txt CMakePresets.json，排除 third_party/README.md）完全一致"
              else
                echo "上次成功构建 ${BUILD_BASE_SHA:0:7} 以来有 ${BUILD_DIFF} 个构建相关文件变更，正常执行构建"
              fi
            else
              echo "未查询到 main 分支成功构建记录，视为有差异，正常执行构建"
            fi
          fi
          echo "build_changed=$BUILD_CHANGED" >> "$GITHUB_OUTPUT"
          echo "build_base=$BUILD_BASE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "使用 tag 版本: $VERSION"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "push" ]]; then
            INPUT="$INPUT_VERSION"
            TYPE="$INPUT_TYPE"
            if [[ -n "$INPUT" ]]; then
              VERSION="${INPUT#v}"
              echo "使用手动输入版本: $VERSION"
            # push main: 仅当存在构建相关变更时自动补丁发版(无变更不发布, 版本留空回退 SHA)
            elif [[ "$TYPE" == "auto" || "$TYPE" == "release" || "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "push" && "$BUILD_CHANGES" -gt 0 ) ]]; then
              LATEST="$LATEST_TAG"
              if [[ -z "$LATEST" ]]; then
                echo "本仓库暂无 v* tag，从初始版本 v0.0.0 起步"
                LATEST="v0.0.0"
              fi
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
              # 版本进位规则: patch 满 100 进位 minor 并重置为 1(0.0.100 → 0.1.1);
              # minor 满 100 进位 major 并重置为 0(0.100.100 → 1.0.1)
              PATCH=$((PATCH+1))
              if [[ "$PATCH" -gt 100 ]]; then MINOR=$((MINOR+1)); PATCH=1; fi
              if [[ "$MINOR" -gt 100 ]]; then MAJOR=$((MAJOR+1)); MINOR=0; PATCH=1; fi
              VERSION="$MAJOR.$MINOR.$PATCH"
              echo "自动递增版本: $LATEST -> v$VERSION"
            fi
          fi
          # 版本号格式校验(写入 GITHUB_OUTPUT 前):
          # 非法输入如 abc 会让下轮自动 bump 算出非法 tag(abc..1), 使每日定时发布链路瘫痪
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VERSION'（须为 x.y.z 纯数字，如 0.0.2；tag 与手动输入同此规则）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════
  # 1. 构建矩阵（windows-x64 / macos-x64 / macos-arm64 / linux-x64）
  #    每平台编译 + 产物功能测试（--help / 非法参数拒绝 / 中文路径完整流程）
  #    sccache 编译缓存加速增量构建
  #    触发：push main|tag / PR / 定时 / 手动(auto|build|release)
  # ═════════════════════════════════════════════════
  Build:
    name: 构建 ${{ matrix.display }}
    needs: Version
    # build_changed=false(与上次成功构建无差异)时跳过整个矩阵, 由 CodeqlScan 的构建跳过说明块输出说明(#81)
    if: |
      needs.Version.outputs.build_changed == 'true' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'build' || inputs.type == 'release')))
    strategy:
      # 单平台失败不取消其余平台: 一次运行尽可能拿到全部平台结果
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            # display 仅用于 Actions 页面任务显示名; name 为产物/目录引用的技术标识, 勿改
            display: Windows_x64
            os: windows-2025
            artifact: GitHubDesktop2Chinese.exe
          - name: macos-x64
            display: macOS_x64
            os: macos-15-intel
            arch: x64
            artifact: GitHubDesktop2Chinese-macos-x64
          - name: macos-arm64
            display: macOS_arm64
            # 原生 ARM(M1) runner: 产物功能测试可原生执行(此前 Intel 交叉编译无法运行测试)
            os: macos-15
            arch: arm64
            artifact: GitHubDesktop2Chinese-macos-arm64
          - name: linux-x64
            display: Linux_x64
            os: ubuntu-24.04
            artifact: GitHubDesktop2Chinese-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # 最小权限：读代码 + 为产物溯源证明申请 OIDC 签名（attestations）
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.Version.outputs.version }}
      # 经 env 传递而非 ${{ }} 内插进脚本（#119，防注入统一约定）
      CI_SHA: ${{ github.sha }}
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # ── 检出 ──
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── sccache 编译缓存（跨 run 复用）──
      - name: 安装 sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      # ── 配置：CMake 生成（失败自动重试 2 次）──
      - name: 配置 CMake（Windows x64）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          $ver = if ($env:RELEASE_VERSION) { "v$env:RELEASE_VERSION" } else { "ci-$env:CI_SHA" }
          # CMake 配置无需联网（OpenSSL 静态库随仓库提交），环境抖动时自动重试
          # #134: CI 告警即错（/W4/-Wall -Wextra 基础上），本地构建不加以降低摩擦
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            cmake -B build -A x64 "-DFILE_VERSION=$ver" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 2) { Write-Error "CMake 配置连续失败 2 次"; exit 1 }
            Write-Warning "CMake 配置失败(第 $attempt 次)，10 秒后重试"
            Start-Sleep -Seconds 10
          }

      - name: 配置 CMake（macOS/Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VER="${RELEASE_VERSION:+v$RELEASE_VERSION}"
          VER="${VER:-ci-${GITHUB_SHA}}"
          EXTRA=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # 单架构包(x64/arm64 由矩阵 arch 指定): 交叉编译; OpenSSL 3.5.9 静态库已内置仓库
            # (third_party/openssl-macos-*, CMake 按架构自动选择), 配置期零下载零编译;
            # 部署目标 11.0 为 arm64 产物下限; LTO 与打包后 strip 进一步压缩体积
            ARCH="${{ matrix.arch }}"
            CMAKE_ARCH="$ARCH"
            if [[ "$ARCH" == "x64" ]]; then CMAKE_ARCH="x86_64"; fi
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=$CMAKE_ARCH")
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
            EXTRA+=("-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE")
          fi
          # #134: CI 告警即错（-Wall -Wextra 基础上），本地构建不加以降低摩擦
          EXTRA+=("-DCMAKE_COMPILE_WARNING_AS_ERROR=ON")
          EXTRA+=("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          EXTRA+=("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          for attempt in 1 2; do
            if cmake -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" "-DFILE_VERSION=$VER" ${EXTRA[@]+"${EXTRA[@]}"}; then
              break
            fi
            [[ $attempt -ge 2 ]] && { echo "::error::CMake 配置连续失败 2 次"; exit 1; }
            echo "::warning::CMake 配置失败(第 $attempt 次)，10 秒后重试"
            sleep 10
          done

      # ── 编译（sccache 加速）──
      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --build build --config "$BUILD_TYPE"
          else
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
            cmake --build build --config "$BUILD_TYPE" -j "$JOBS"
          fi

      # ── #167: version_test 单测真实执行(此前仅被构建从不运行, 104 项断言闲置) ──
      # 四平台均为原生 runner(含 macos-15 原生 ARM), 无交叉编译, 测试可原生执行;
      # --no-tests=error: version_test 为唯一注册测试, 0 项被发现视为 CTest 接入回归
      - name: 运行单元测试 (ctest)
        shell: bash
        run: |
          set -euo pipefail
          # MSVC 多配置生成器须 -C; 单配置生成器(Unix Makefiles)忽略 -C 无害
          ctest --test-dir build --output-on-failure -C "$BUILD_TYPE" --no-tests=error

      # ── 产物验证：功能冒烟（x64 原生执行）+ macOS 架构/自包含断言 ──
      - name: 产物功能测试
        shell: bash
        run: |
          set -euo pipefail
          # 交叉编译产物(目标架构 ≠ runner 原生架构)无法执行, 由后续架构/自包含断言覆盖
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            NATIVE="$(uname -m)"
            EXPECT="${{ matrix.arch }}"
            if [[ "$EXPECT" == "x64" ]]; then EXPECT="x86_64"; fi
            if [[ "$NATIVE" != "$EXPECT" ]]; then
              echo "跳过: 交叉产物($EXPECT)无法在本 runner($NATIVE) 原生运行"
              exit 0
            fi
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="build/Release/${EXE_NAME}"
          else
            BIN="build/GitHubDesktop2Chinese"
          fi
          [[ -f "$BIN" ]] || { echo "::error::未找到构建产物 $BIN"; exit 1; }

          echo "== 测试1: --help 应 exit 0 =="
          "$BIN" --help > /dev/null
          echo "OK"

          echo "== 测试2: 非法参数应被拒绝(exit!=0) =="
          if "$BIN" thisargdoesnotexist > /dev/null 2>&1; then
            echo "::error::非法参数未被拒绝"
            exit 1
          fi
          echo "OK"

          echo "== 测试3: 中文路径 + EOF 完整汉化流程应 exit 0 =="
          FIXTURE="$RUNNER_TEMP/汉化测试目录"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          printf '<html></html>' > "$FIXTURE/index.html"
          printf '// fixture main\n' > "$FIXTURE/main.js"
          printf '// fixture renderer\n' > "$FIXTURE/renderer.js"
          set +e
          # CI 构建版本为 ci-<sha> 占位符(解析为 0.0.0, 低于映射文件 minversion):
          # --nopause 下默认中止, 加 --force 显式继续并顺带覆盖该强制执行路径
          OUT="$(echo "" | "$BIN" -g "$FIXTURE" --nopause --force 2>&1)"
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            echo "$OUT"
            echo "::error::完整流程 exit=$CODE"
            exit 1
          fi
          grep -q "renderer.js 文件汉化结束" <<< "$OUT" || { echo "$OUT"; echo "::error::流程未到达 renderer 汉化完成"; exit 1; }
          echo "OK"

      # ── 打包与归档：命名 → strip → 架构/自包含断言 → attestation → 上传 ──
      - name: 准备发布文件名
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "build/Release/${EXE_NAME}" "dist/${{ matrix.artifact }}"
          else
            cp build/GitHubDesktop2Chinese "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi
          ls -l dist/

      - name: macOS 裁剪符号 (strip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          BEFORE="$(stat -f%z "$BIN")"
          strip -x "$BIN"
          AFTER="$(stat -f%z "$BIN")"
          ls -l "$BIN"
          echo "strip 体积: $BEFORE -> $AFTER bytes"

      - name: macOS 架构与自包含断言
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.artifact }}"
          EXPECT="${{ matrix.arch }}"
          if [[ "$EXPECT" == "x64" ]]; then EXPECT="x86_64"; fi
          OPPOSITE="arm64"
          if [[ "$EXPECT" == "arm64" ]]; then OPPOSITE="x86_64"; fi
          echo "== 架构检查(应为单架构 $EXPECT) =="
          INFO="$(lipo -info "$BIN")"
          echo "$INFO"
          grep -q "$EXPECT" <<< "$INFO" || { echo "::error::产物缺少 $EXPECT 架构"; exit 1; }
          if grep -q "$OPPOSITE" <<< "$INFO"; then
            echo "::error::产物存在多余架构 $OPPOSITE(应为单架构包)"
            exit 1
          fi
          echo "== 自包含检查(不得依赖非系统动态库) =="
          otool -L "$BIN"
          if otool -L "$BIN" | grep '^[[:space:]]' | grep -Ev '(/usr/lib/|/System/)'; then
            echo "::error::产物仍依赖非系统动态库(如 brew 路径), 自包含校验失败"
            exit 1
          fi
          echo "OK"

      - name: 生成产物溯源证明（attestation）
        # PR 事件不执行：PR 的 id-token(OIDC) 权限受限（尤其 fork PR），且 PR 产物无需发布级溯源
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.artifact }}

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.name }}-${{ needs.Version.outputs.version || github.sha }}
          if-no-files-found: error
          path: dist/

  # ═════════════════════════════════════════════════
  # 2. 质量校验门（JsonCheck）
  #    合并原 json-quality / encoding-check / tools-test 三任务:
  #    三者依赖一致(均 ← version), 触发条件近同, 合并减少排队开销;
  #    另含 Markdown 链接检查与单工作流规范校验(W0-W6)及校验器单测;
  #    任一检查失败即本任务失败, 维持原质量门语义;
  #    注意: name 即分支保护必需 check, 改名须同步
  #    branches/main/protection required_status_checks(#156)
  # ═════════════════════════════════════════════════
  JsonCheck:
    name: 质量校验门（json/编码/工具/md/工作流）
    needs: Version
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 深度校验 localization.json
        run: python tools/ci/check-localization.py

      # 源码编码格式质量门（UTF-8 无 BOM）#88: 全量扫描 git 跟踪文本文件;
      # 非 UTF-8 / 意外 BOM 以明确清单(::error::)使流程失败; 第三方依赖排除;
      # smoke-test.ps1 为 BOM 白名单例外; 配置单一事实来源: tools/ci/encoding-check.json（#90）
      - name: 全量扫描源码编码（UTF-8 无 BOM）
        run: python tools/ci/check-encoding.py --config tools/ci/encoding-check.json

      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 语法检查
        working-directory: tools/auto-maintain
        run: |
          for f in src/*.js; do node --check "$f"; done
          echo "所有源文件语法检查通过"

      - name: 单元测试（提取过滤 + 草稿生成逻辑）
        run: node tools/ci/tools-self-test.mjs

      - name: Markdown 链接检查
        run: python tools/ci/md-check.py

      - name: 单工作流规范校验（W0-W6）
        run: python tools/ci/check-workflow.py

      - name: 单工作流校验器单元测试
        run: python tools/ci/check-workflow-test.py

  # ═════════════════════════════════════════════════
  # 3. 安全与维护门（CodeQL 安全扫描 + 自动维护 + Wiki 同步 + 构建跳过说明）
  #    合并原 codeql / auto-maintain / sync-wiki / build-skip-notice 四任务:
  #    保持 windows-2025 runner —— CodeQL 须扫描 _WIN32 代码分支;
  #    四块步骤以 gate 判定 + step if 独立控制, 任一块失败即任务失败(维持原质量门语义)
  # ═════════════════════════════════════════════════
  CodeqlScan:
    name: CodeQL 安全扫描
    # 显式直连 Version: GitHub 仅直接 needs 可访问其 outputs(说明块的 build_changed/build_base、
    # 任务级 if 的 tag 空跑分支), 经 JsonCheck 间接依赖不传递 outputs
    needs: [Version, JsonCheck]
    # 任务级条件为四块触发并集: 保证相应事件下壳运行, 块内步骤再按各自原条件细分;
    # tag push 时四块条件均不满足 → 空跑成功, 不阻断 Release 的 needs
    if: |
      needs.Version.outputs.build_changed == 'false' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: windows-2025
    # 各块最坏串行: CodeQL 30 + 维护 50 + Wiki 10 + 说明 3, 留余量
    timeout-minutes: 100
    # 合并权限集: CodeQL SARIF 上传 + 维护报告 Issue + Wiki 推送
    permissions:
      contents: write
      issues: write
      security-events: write
    env:
      # cpp 语言查询包不支持 overlay-base 增量分析，显式关闭以避免构建回退告警
      CODEQL_OVERLAY_DATABASE_MODE: none
      # fetch.js 查询 GitHub API 时使用；匿名限额 60 次/小时会被共享 runner IP 触发 403（#119）
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # fetch-depth: 2 —— Wiki 同步需要 before(HEAD 的父)做 docs/wiki diff 基准;
      # 多 commit 一次 push 时 before 缺失 → fail-safe 视为有变更, 同步幂等无害
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      # ── 块1: CodeQL 安全扫描（PR 同仓 / push main / 手动 auto|security|release; 不含定时与 tag）──
      - name: CodeQL 触发判定
        id: codeql_gate
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'release'))
        shell: bash
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 初始化 CodeQL
        if: steps.codeql_gate.outputs.enabled == 'true'
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: 配置 CMake (x64)
        if: steps.codeql_gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DFILE_VERSION="codeql"

      - name: 为 CodeQL 构建
        if: steps.codeql_gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config Release

      - name: 执行 CodeQL 分析
        if: steps.codeql_gate.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"

      # ── 块2: 自动维护（失效检测 + 候选提取 → 创建/更新 Issue）──
      # !cancelled(): CodeQL 块失败不阻断维护(原独立任务语义); 任务被取消时不执行
      - name: 自动维护触发判定
        id: maintain_gate
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain' || inputs.type == 'release'))) }}
        shell: bash
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 安装 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.maintain_gate.outputs.enabled == 'true'
        with:
          node-version: 24

      # Git Bash 自带 unzip; Linux 才走 apt 安装; 均缺失则显式失败
      - name: 安装解压工具（缺失时）
        if: steps.maintain_gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            echo "unzip 可用"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y unzip
          else
            echo "::error::当前 runner 缺少 unzip 且无法自动安装"
            exit 1
          fi

      - name: 查询 GitHub Desktop 最新版本
        if: steps.maintain_gate.outputs.enabled == 'true'
        id: version
        working-directory: tools/auto-maintain
        shell: bash
        run: |
          set -euo pipefail
          LATEST=""
          for attempt in 1 2 3; do
            if LATEST="$(timeout 120 node -e "import('./src/fetch.js').then(async m=>{const r=await m.getLatestRelease();console.log(r.version)}).catch(e=>{console.error(e.message);process.exit(1)})")"; then
              break
            fi
            echo "::warning::查询 GitHub Desktop 最新版本失败(第 ${attempt} 次)，10 秒后重试"
            sleep 10
          done
          [[ -n "$LATEST" ]] || { echo "::error::查询 GitHub Desktop 最新版本连续失败 3 次"; exit 1; }
          echo "ghdesktop_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "查询到 GitHub Desktop 最新版本: $LATEST"

      - name: 缓存安装包与提取结果
        if: steps.maintain_gate.outputs.enabled == 'true'
        id: cache-maintain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/ghdesktop-auto-maintain
          # key 含 GHD 版本/平台/工具源码/映射文件哈希: 映射变更即作废缓存重新下载安装包
          key: ghd-maintain-v4-${{ steps.version.outputs.ghdesktop_version }}-${{ runner.os }}-${{ hashFiles('tools/auto-maintain/src/**', 'json/localization.json') }}

      - name: 运行失效检测 + 未翻译候选提取
        if: steps.maintain_gate.outputs.enabled == 'true'
        working-directory: tools/auto-maintain
        shell: bash
        run: |
          set -euo pipefail
          attempt=0
          until timeout 1200 node src/index.js check extract \
            --workdir "$RUNNER_TEMP/ghdesktop-auto-maintain" \
            --top 100 \
            --write-report; do
            attempt=$((attempt + 1))
            if [[ $attempt -ge 2 ]]; then
              echo "::error::失效检测连续失败 2 次"
              exit 1
            fi
            echo "::warning::失效检测失败(第 ${attempt} 次)，20 秒后重试"
            sleep 20
          done

      - name: 创建或更新自动维护 Issue
        if: steps.maintain_gate.outputs.enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = require('./tools/ci/report-issue.js');
            await run({ github, context, core });

      # ── 块3: 同步 docs/wiki → GitHub Wiki（push main / 手动 auto|release; 检测到变更才执行）──
      - name: Wiki 同步触发判定
        id: wiki_gate
        if: ${{ !cancelled() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'release'))) }}
        shell: bash
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 检测 docs/wiki 变更
        if: steps.wiki_gate.outputs.enabled == 'true'
        id: wiki-changed
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # 手动触发 before 为空 / 新分支首推 before 全零 → 视为有变更(尊重用户意图)
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # before 不在浅克隆历史中(多 commit 推送/历史改写) → fail-safe 视为有变更
          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- docs/wiki; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/wiki 无变更, 跳过同步"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步 docs/wiki 到 GitHub Wiki
        if: steps.wiki_gate.outputs.enabled == 'true' && steps.wiki-changed.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/sync-wiki.sh

      # ── 块4: 构建跳过说明（无差异时输出醒目说明, skipped job 自身无日志）#81 ──
      - name: 输出跳过原因（Step Summary + notice 注释 + 日志）
        if: ${{ !cancelled() && needs.Version.outputs.build_changed == 'false' }}
        shell: bash
        env:
          BUILD_BASE: ${{ needs.Version.outputs.build_base }}
        run: |
          BASE_SHORT="${BUILD_BASE:0:7}"
          {
            echo "## 无差异，已跳过构建"
            echo ""
            echo "**原因**：自上一次成功构建 \`${BASE_SHORT}\` 以来，影响构建产物的路径"
            echo "（\`json/\`、\`src/\`、\`third_party/\`、\`CMakeLists.txt\`、\`CMakePresets.json\`，"
            echo "排除纯文档 \`third_party/README.md\`）**无任何变更**，构建产物不会变化，"
            echo "故跳过构建以节省 runner 资源。"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 对比基准（上次成功构建） | \`${BASE_SHORT}\` |"
            echo "| 当前 commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| 白名单路径 | \`json/\` \`src/\` \`third_party/\` \`CMakeLists.txt\` \`CMakePresets.json\` |"
            echo "| 跳过范围 | 四平台构建矩阵（Windows x64 / macOS x64 / macOS arm64 / Linux x64） |"
            echo ""
            echo "质量校验与自动维护任务不受影响照常执行；"
            echo "下次检测到构建相关变更时将自动恢复构建。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::无差异，已跳过构建：基准 ${BASE_SHORT} 与当前 ${GITHUB_SHA:0:7} 的构建相关路径完全一致，四平台构建矩阵全部跳过"
          echo "无差异，已跳过构建（对比基准：上次成功构建 ${BASE_SHORT}）"

  # ═════════════════════════════════════════════════
  # 4. OpenSSL 版本定时检测（周一 UTC 02:00）
  #    查 3.5 LTS 系列最新, 与仓库当前版本对比; 有新版本输出 trigger_vendor=true
  # ═════════════════════════════════════════════════
  OpensslCheck:
    name: OpenSSL 版本检测
    needs: CodeqlScan
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      latest_ver: ${{ steps.check.outputs.latest_ver }}
      current_ver: ${{ steps.check.outputs.current_ver }}
      trigger_vendor: ${{ steps.check.outputs.trigger_vendor }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 检测 OpenSSL 3.5 LTS 系列最新版本
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 版本策略: 跟随 3.5 LTS 系列最新 patch（官方政策 openssl-library.org/policies/releasestrat:
          # 3.5 为 LTS 支持至 2030-04; 4.0 非 LTS 2027-05 到期, 不采纳——LTS 维护成本最低）。
          # 正则精确匹配 3.5.x 纯数字 patch, 排除 beta/alpha 等预发布; 数值排序取最大
          LATEST_VER=""
          for attempt in 1 2 3; do
            LATEST_VER="$(gh api "repos/openssl/openssl/releases?per_page=100" \
              --jq '[.[] | select(.tag_name | test("^openssl-3\\.5\\.[0-9]+$")) | .tag_name | ltrimstr("openssl-")] | sort_by(split(".") | map(tonumber)) | last' 2>/dev/null || true)"
            [[ -n "$LATEST_VER" && "$LATEST_VER" != "null" ]] && break
            echo "::warning::查询 OpenSSL 3.5 LTS 最新版本失败(第 ${attempt} 次), 10 秒后重试"
            sleep 10
          done
          if [[ -z "$LATEST_VER" || "$LATEST_VER" == "null" ]]; then
            echo "::error::无法查询 OpenSSL 3.5 LTS 系列最新版本（连续 3 次失败, 请检查网络或稍后重试）"
            exit 1
          fi
          CUR_VER="$(sed -n 's/^# *define *OPENSSL_VERSION_STR "\(.*\)".*/\1/p' \
            third_party/openssl/include/openssl/opensslv.h | head -n1)"
          echo "latest_ver=$LATEST_VER" >> "$GITHUB_OUTPUT"
          echo "current_ver=$CUR_VER" >> "$GITHUB_OUTPUT"
          echo "3.5 LTS 系列最新: $LATEST_VER, 仓库当前: $CUR_VER"
          if [[ "$CUR_VER" != "$LATEST_VER" ]]; then
            echo "trigger_vendor=true" >> "$GITHUB_OUTPUT"
            echo "::notice::检测到 3.5 LTS 系列新版本: $CUR_VER -> $LATEST_VER, 将触发产库"
          else
            echo "trigger_vendor=false" >> "$GITHUB_OUTPUT"
            echo "::notice::已是最新: $CUR_VER, 跳过产库"
          fi

  # ═════════════════════════════════════════════════
  # 5. 产库 OpenSSL - Linux（x64 静态库; 供 CMake Linux 静态链接内置化）
  #    触发: PR 标签 vendor-openssl / 手动 vendor / OpensslCheck 检测到新版本
  # ═════════════════════════════════════════════════
  OpensslLinux:
    name: 产库 OpenSSL (linux x64)
    if: |
      always() && (
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vendor-openssl') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'vendor') ||
      (github.event_name == 'schedule' && needs.OpensslCheck.outputs.trigger_vendor == 'true'))
    # 单工作流规范: 纳入依赖图
    needs: [CodeqlScan, OpensslCheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # tarball_sha256 由校验步骤统一输出: 编译路径写入 prefix/tarball.sha256, 缓存命中时从该文件恢复
      tarball_sha256: ${{ steps.verify.outputs.tarball_sha256 }}
      resolved_ver: ${{ steps.resolve.outputs.ossl_ver }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 解析产库版本
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INPUT_VER="${{ github.event.inputs.openssl-version }}"
          OSSL_VER=""
          if [[ -n "$INPUT_VER" ]]; then
            OSSL_VER="$INPUT_VER"
          else
            # 留空自动取 3.5 LTS 系列最新 patch(注7): 与 OpensslVendorPR 校验同源。
            # 版本策略: 3.5 为 LTS 支持至 2030-04, 4.0 非 LTS 不采纳(维护成本最低);
            # 防御式解析(#F1): gh CLI 解析 JSON(跨平台行为一致, 避开 macOS BSD grep/sed 与 bash 3.2
            # 的管道差异——此前 curl|grep|sed 在 macOS 失败路径下致 set -u 报 unbound variable);
            # 变量先初始化 + 3 次重试 + 失败给出明确错误
            for attempt in 1 2 3; do
              LATEST_TAG="$(gh api "repos/openssl/openssl/releases?per_page=100" \
                --jq '[.[] | select(.tag_name | test("^openssl-3\\.5\\.[0-9]+$")) | .tag_name | ltrimstr("openssl-")] | sort_by(split(".") | map(tonumber)) | last' 2>/dev/null || true)"
              OSSL_VER="${LATEST_TAG#openssl-}"
              [[ -n "$OSSL_VER" && "$OSSL_VER" != "null" ]] && break
              echo "::warning::获取 OpenSSL 3.5 LTS 最新版本失败(第 ${attempt} 次), 10 秒后重试"
              sleep 10
            done
            if [[ -z "$OSSL_VER" || "$OSSL_VER" == "null" ]]; then
              echo "::error::无法获取 OpenSSL 3.5 LTS 系列最新版本（连续 3 次失败, 请检查网络或稍后重试）"
              exit 1
            fi
            echo "未指定 openssl-version, 自动取 3.5 LTS 系列最新: $OSSL_VER"
          fi
          if ! printf '%s' "$OSSL_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::openssl-version 格式非法: $OSSL_VER（应为 X.Y.Z, 不带 v/openssl- 前缀）"
            exit 1
          fi
          echo "OSSL_VER=$OSSL_VER" >> "$GITHUB_ENV"
          echo "ossl_ver=$OSSL_VER" >> "$GITHUB_OUTPUT"

      - name: 恢复产库编译产物缓存（同版本重跑秒级完成）
        id: cache-ossl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/openssl-linux-x64
          key: openssl-linux-x64-${{ env.OSSL_VER }}

      - name: 编译 OpenSSL（x64）
        id: build
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf openssl-src "openssl-$OSSL_VER.tar.gz" "openssl-$OSSL_VER.tar.gz.sha256"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz.sha256" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz.sha256"
          sha256sum -c "openssl-$OSSL_VER.tar.gz.sha256"
          mkdir -p openssl-src
          tar -xzf "openssl-$OSSL_VER.tar.gz" -C openssl-src --strip-components=1
          cd openssl-src
          ./Configure linux-x86_64 -fPIC no-shared no-tests no-apps no-zlib \
            --prefix="$RUNNER_TEMP/openssl-linux-x64" --libdir=lib
          make -j"$(nproc)" build_libs
          make install_dev
          # tarball_sha256 记录(#F2): GNU coreutils 在文件名含反斜杠(Windows 全路径
          # D:\a\_temp/...)时输出行带 '\' 转义前缀, 且 Windows 二进制模式为 "hash *file";
          # 截断到首个空格, 再剥离可能的 '\' 前缀, 三平台统一得到纯哈希。
          # 写入 prefix 目录(缓存内容): 缓存命中时由校验步骤从该文件恢复输出
          HASH="$(sha256sum "$RUNNER_TEMP/openssl-$OSSL_VER.tar.gz")"
          HASH="${HASH%% *}"
          HASH="${HASH#\\}"
          echo "$HASH" > "$RUNNER_TEMP/openssl-linux-x64/tarball.sha256"

      - name: 校验产物齐备
        id: verify
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/openssl-linux-x64"
          for f in "$PREFIX/include/openssl/ssl.h" "$PREFIX/lib/libssl.a" "$PREFIX/lib/libcrypto.a"; do
            [[ -f "$f" ]] || { echo "::error::缺少产物: $f"; exit 1; }
          done
          HASH="$(cat "$PREFIX/tarball.sha256" 2>/dev/null || true)"
          if [[ ! "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tarball.sha256 缺失或非法: '$HASH'（编译/缓存异常, 可删除对应缓存后重试）"
            exit 1
          fi
          echo "tarball_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "产库产物齐备: $PREFIX（tarball SHA256: $HASH）"

      - name: 上传产库产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssl-linux-x64
          path: |
            ${{ runner.temp }}/openssl-linux-x64/include
            ${{ runner.temp }}/openssl-linux-x64/lib
          retention-days: 7
          if-no-files-found: error

  # ═════════════════════════════════════════════════
  # 6. 产库 OpenSSL - Windows（x64 .lib; 产物用于替换内置库）
  #    触发: 同 OpensslLinux
  # ═════════════════════════════════════════════════
  OpensslWin:
    name: 产库 OpenSSL (windows x64)
    if: |
      always() && (
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vendor-openssl') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'vendor') ||
      (github.event_name == 'schedule' && needs.OpensslCheck.outputs.trigger_vendor == 'true'))
    # 单工作流规范: 纳入依赖图
    needs: [CodeqlScan, OpensslCheck]
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      # tarball_sha256 由校验步骤统一输出: 编译路径写入 prefix/tarball.sha256, 缓存命中时从该文件恢复
      tarball_sha256: ${{ steps.verify.outputs.tarball_sha256 }}
      resolved_ver: ${{ steps.resolve.outputs.ossl_ver }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 解析产库版本
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INPUT_VER="${{ github.event.inputs.openssl-version }}"
          OSSL_VER=""
          if [[ -n "$INPUT_VER" ]]; then
            OSSL_VER="$INPUT_VER"
          else
            # 留空自动取 3.5 LTS 系列最新 patch(注7): 与 OpensslVendorPR 校验同源。
            # 版本策略: 3.5 为 LTS 支持至 2030-04, 4.0 非 LTS 不采纳(维护成本最低);
            # 防御式解析(#F1): gh CLI 解析 JSON(跨平台行为一致, 避开 macOS BSD grep/sed 与 bash 3.2
            # 的管道差异——此前 curl|grep|sed 在 macOS 失败路径下致 set -u 报 unbound variable);
            # 变量先初始化 + 3 次重试 + 失败给出明确错误
            for attempt in 1 2 3; do
              LATEST_TAG="$(gh api "repos/openssl/openssl/releases?per_page=100" \
                --jq '[.[] | select(.tag_name | test("^openssl-3\\.5\\.[0-9]+$")) | .tag_name | ltrimstr("openssl-")] | sort_by(split(".") | map(tonumber)) | last' 2>/dev/null || true)"
              OSSL_VER="${LATEST_TAG#openssl-}"
              [[ -n "$OSSL_VER" && "$OSSL_VER" != "null" ]] && break
              echo "::warning::获取 OpenSSL 3.5 LTS 最新版本失败(第 ${attempt} 次), 10 秒后重试"
              sleep 10
            done
            if [[ -z "$OSSL_VER" || "$OSSL_VER" == "null" ]]; then
              echo "::error::无法获取 OpenSSL 3.5 LTS 系列最新版本（连续 3 次失败, 请检查网络或稍后重试）"
              exit 1
            fi
            echo "未指定 openssl-version, 自动取 3.5 LTS 系列最新: $OSSL_VER"
          fi
          if ! printf '%s' "$OSSL_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::openssl-version 格式非法: $OSSL_VER（应为 X.Y.Z, 不带 v/openssl- 前缀）"
            exit 1
          fi
          echo "OSSL_VER=$OSSL_VER" >> "$GITHUB_ENV"
          echo "ossl_ver=$OSSL_VER" >> "$GITHUB_OUTPUT"

      - name: 恢复产库编译产物缓存（同版本重跑秒级完成）
        id: cache-ossl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/openssl-windows-x64
          key: openssl-windows-x64-${{ env.OSSL_VER }}

      - name: 下载并解压 OpenSSL 源码
        id: src
        shell: bash
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf openssl-src "openssl-$OSSL_VER.tar.gz" "openssl-$OSSL_VER.tar.gz.sha256"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz.sha256" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz.sha256"
          sha256sum -c "openssl-$OSSL_VER.tar.gz.sha256"
          mkdir -p openssl-src
          tar -xzf "openssl-$OSSL_VER.tar.gz" -C openssl-src --strip-components=1
          # tarball_sha256 记录(#F2): GNU coreutils 在文件名含反斜杠(Windows 全路径
          # D:\a\_temp/...)时输出行带 '\' 转义前缀, 且 Windows 二进制模式为 "hash *file";
          # 截断到首个空格, 再剥离可能的 '\' 前缀, 三平台统一得到纯哈希
          HASH="$(sha256sum "$RUNNER_TEMP/openssl-$OSSL_VER.tar.gz")"
          HASH="${HASH%% *}"
          HASH="${HASH#\\}"
          echo "tarball_sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: 配置 OpenSSL（VC-WIN64A）
        shell: cmd
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo ::error::vswhere 未找到 Visual Studio（缺少 VC 工具集）
            exit /b 1
          )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%\openssl-src"
          perl Configure VC-WIN64A no-shared no-tests no-apps no-zlib no-asm --prefix="%RUNNER_TEMP%\openssl-windows-x64" --openssldir="%RUNNER_TEMP%\openssl-windows-x64\ssl"
          if errorlevel 1 exit /b 1

      - name: 编译并安装（build_libs + install_dev）
        shell: cmd
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (
            echo ::error::vswhere 未找到 Visual Studio（缺少 VC 工具集）
            exit /b 1
          )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%\openssl-src"
          nmake build_libs
          if errorlevel 1 exit /b 1
          nmake install_dev
          if errorlevel 1 exit /b 1

      - name: 校验产物齐备
        id: verify
        shell: bash
        env:
          # 编译路径的源码包 SHA256(缓存命中时 src 步骤被跳过, 值为空)
          SRC_HASH: ${{ steps.src.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/openssl-windows-x64"
          for f in "$PREFIX/include/openssl/ssl.h" "$PREFIX/lib/libssl.lib" "$PREFIX/lib/libcrypto.lib"; do
            [[ -f "$f" ]] || { echo "::error::缺少产物: $f"; exit 1; }
          done
          # tarball_sha256: 编译路径由 src 步骤输出, 写入 prefix(缓存内容)供下次命中复用;
          # 缓存命中时直接读文件
          HASH_FILE="$PREFIX/tarball.sha256"
          if [[ -n "$SRC_HASH" ]]; then
            echo "$SRC_HASH" > "$HASH_FILE"
          fi
          HASH="$(cat "$HASH_FILE" 2>/dev/null || true)"
          if [[ ! "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tarball.sha256 缺失或非法: '$HASH'（编译/缓存异常, 可删除对应缓存后重试）"
            exit 1
          fi
          echo "tarball_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "产库产物齐备: $PREFIX（tarball SHA256: $HASH）"

      - name: 上传产库产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssl-windows-x64
          path: |
            ${{ runner.temp }}/openssl-windows-x64/include
            ${{ runner.temp }}/openssl-windows-x64/lib
          retention-days: 7
          if-no-files-found: error

  # ═════════════════════════════════════════════════
  # 7. 产库 OpenSSL - macOS（arm64 原生编译）
  #    触发: 同 OpensslLinux
  # ═════════════════════════════════════════════════
  OpensslMacosArm64:
    name: 产库 OpenSSL (macOS arm64)
    if: |
      always() && (
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vendor-openssl') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'vendor') ||
      (github.event_name == 'schedule' && needs.OpensslCheck.outputs.trigger_vendor == 'true'))
    # 单工作流规范: 纳入依赖图
    needs: [CodeqlScan, OpensslCheck]
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      # tarball_sha256 由校验步骤统一输出: 编译路径写入 prefix/tarball.sha256, 缓存命中时从该文件恢复
      tarball_sha256: ${{ steps.verify.outputs.tarball_sha256 }}
      resolved_ver: ${{ steps.resolve.outputs.ossl_ver }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 解析产库版本
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INPUT_VER="${{ github.event.inputs.openssl-version }}"
          OSSL_VER=""
          if [[ -n "$INPUT_VER" ]]; then
            OSSL_VER="$INPUT_VER"
          else
            # 留空自动取 3.5 LTS 系列最新 patch(注7): 与 OpensslVendorPR 校验同源。
            # 版本策略: 3.5 为 LTS 支持至 2030-04, 4.0 非 LTS 不采纳(维护成本最低);
            # 防御式解析(#F1): gh CLI 解析 JSON(跨平台行为一致, 避开 macOS BSD grep/sed 与 bash 3.2
            # 的管道差异——此前 curl|grep|sed 在 macOS 失败路径下致 set -u 报 unbound variable);
            # 变量先初始化 + 3 次重试 + 失败给出明确错误
            for attempt in 1 2 3; do
              LATEST_TAG="$(gh api "repos/openssl/openssl/releases?per_page=100" \
                --jq '[.[] | select(.tag_name | test("^openssl-3\\.5\\.[0-9]+$")) | .tag_name | ltrimstr("openssl-")] | sort_by(split(".") | map(tonumber)) | last' 2>/dev/null || true)"
              OSSL_VER="${LATEST_TAG#openssl-}"
              [[ -n "$OSSL_VER" && "$OSSL_VER" != "null" ]] && break
              echo "::warning::获取 OpenSSL 3.5 LTS 最新版本失败(第 ${attempt} 次), 10 秒后重试"
              sleep 10
            done
            if [[ -z "$OSSL_VER" || "$OSSL_VER" == "null" ]]; then
              echo "::error::无法获取 OpenSSL 3.5 LTS 系列最新版本（连续 3 次失败, 请检查网络或稍后重试）"
              exit 1
            fi
            echo "未指定 openssl-version, 自动取 3.5 LTS 系列最新: $OSSL_VER"
          fi
          if ! printf '%s' "$OSSL_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::openssl-version 格式非法: $OSSL_VER（应为 X.Y.Z, 不带 v/openssl- 前缀）"
            exit 1
          fi
          echo "OSSL_VER=$OSSL_VER" >> "$GITHUB_ENV"
          echo "ossl_ver=$OSSL_VER" >> "$GITHUB_OUTPUT"

      - name: 恢复产库编译产物缓存（同版本重跑秒级完成）
        id: cache-ossl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/openssl-macos-arm64
          key: openssl-macos-arm64-${{ env.OSSL_VER }}

      - name: 编译 OpenSSL（arm64 ≈8 分钟）
        id: build
        if: steps.cache-ossl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TARGET=darwin64-arm64-cc
          export MACOSX_DEPLOYMENT_TARGET=11.0
          cd "$RUNNER_TEMP"
          rm -rf openssl-src "openssl-$OSSL_VER.tar.gz" "openssl-$OSSL_VER.tar.gz.sha256"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "openssl-$OSSL_VER.tar.gz.sha256" \
            "https://github.com/openssl/openssl/releases/download/openssl-$OSSL_VER/openssl-$OSSL_VER.tar.gz.sha256"
          sha256sum -c "openssl-$OSSL_VER.tar.gz.sha256"
          mkdir -p openssl-src
          tar -xzf "openssl-$OSSL_VER.tar.gz" -C openssl-src --strip-components=1
          cd openssl-src
          ./Configure "$TARGET" no-shared no-tests no-apps no-zlib \
            --prefix="$RUNNER_TEMP/openssl-macos-arm64"
          make -j"$(sysctl -n hw.ncpu)" build_libs
          make install_dev
          # tarball_sha256 记录(#F2): GNU coreutils 在文件名含反斜杠(Windows 全路径
          # D:\a\_temp/...)时输出行带 '\' 转义前缀, 且 Windows 二进制模式为 "hash *file";
          # 截断到首个空格, 再剥离可能的 '\' 前缀, 三平台统一得到纯哈希。
          # 写入 prefix 目录(缓存内容): 缓存命中时由校验步骤从该文件恢复输出
          HASH="$(sha256sum "$RUNNER_TEMP/openssl-$OSSL_VER.tar.gz")"
          HASH="${HASH%% *}"
          HASH="${HASH#\\}"
          echo "$HASH" > "$RUNNER_TEMP/openssl-macos-arm64/tarball.sha256"

      - name: 校验产物齐备
        id: verify
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/openssl-macos-arm64"
          for f in "$PREFIX/include/openssl/ssl.h" "$PREFIX/lib/libssl.a" "$PREFIX/lib/libcrypto.a"; do
            [[ -f "$f" ]] || { echo "::error::缺少产物: $f"; exit 1; }
          done
          HASH="$(cat "$PREFIX/tarball.sha256" 2>/dev/null || true)"
          if [[ ! "$HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tarball.sha256 缺失或非法: '$HASH'（编译/缓存异常, 可删除对应缓存后重试）"
            exit 1
          fi
          echo "tarball_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "产库产物齐备: $PREFIX（tarball SHA256: $HASH）"

      - name: 上传产库产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openssl-macos-arm64
          path: |
            ${{ runner.temp }}/openssl-macos-arm64/include
            ${{ runner.temp }}/openssl-macos-arm64/lib
          retention-days: 7
          if-no-files-found: error

  # ═════════════════════════════════════════════════
  # 8. 产库 OpenSSL - macOS（x64 原生编译）
  #    触发: 同 OpensslLinux
  # ═════════════════════════════════════════════════
  OpensslMacosX64:
