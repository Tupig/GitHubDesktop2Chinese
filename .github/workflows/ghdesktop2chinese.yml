# GitHubDesktop2Chinese 统一 CI/CD 工作流
# 一个工作流完成：自动构建、质量与安全检查、失效检测/候选提取、Release 发布。
#
# ── 触发 ─────────────────────────────────────────────────────
#   定时（每日北京时间上午 10:00 = UTC 02:00）
#                     扫描 GitHub Desktop 最新版 + 提取翻译候选 + 构建产物
#                     （仅当 json/src/third_party/CMake 有变更时才发布 Release）
#   PR                构建 + 质量与安全检查（不发布）
#   推送 tag v*       构建并发布（版本号取 tag）
#   手动触发 type=    auto     构建 + 质量 + 维护 + 发布（无变更则跳过发布）
#                     build    仅构建
#                     security 仅质量与安全扫描
#                     maintain 仅失效检测/候选提取
#                     release  构建 + 发布（始终发布）
#
# ── job 依赖关系 ─────────────────────────────────────────────
#   version（版本解析，无依赖）
#       ├── build（需 version）
#       └── release（需 version + build 产物）
#   json-quality / tools-test / codeql / auto-maintain 相互独立、与上述并行
#
# ── 构建产物约定 ─────────────────────────────────────────────
#   编译输出  build/Release/GitHubDesktop2Chinese.exe
#             （cmake -B build；MSVC 多配置生成器 → Release 子目录）
#   Artifact  GitHubDesktop2Chinese-x64-<版本号|SHA>
#   发布资产  release/GitHubDesktop2Chinese.exe 与 release/localization.json
#             （上传至对应 v* tag 的 Release）
#
# ── 版本号规则 ───────────────────────────────────────────────
#   tag 触发     取 tag 版本（v1.2.5 → 1.2.5）
#   手动 version 使用输入值
#   auto/release/定时 未输入时自动升级补丁号（最新 v* tag +1）
#
# ── 稳定性设计 ───────────────────────────────────────────────
#   - runner 固定版本（ubuntu-24.04 / windows-2025），CodeQL v4
#   - 所有 job 均设 timeout-minutes 上限
#   - 网络/配置类关键步骤内置超时与自动重试
#   - OpenSSL 静态库、GitHub Desktop 安装包与提取结果均走 actions/cache

name: GitHubDesktop2Chinese

on:
  # 每日北京时间上午 10:00（UTC 02:00）
  schedule:
    - cron: "0 2 * * *"
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      type:
        description: "执行类型"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - build
          - security
          - maintain
          - release
      version:
        description: "发布版本号（不带 v 前缀，如 1.2.5；留空则自动升级补丁号）"
        required: false
        type: string

concurrency:
  group: ghdesktop2chinese-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  security-events: write

env:
  BUILD_TYPE: Release
  EXE_NAME: GitHubDesktop2Chinese.exe
  ARTIFACT_PREFIX: GitHubDesktop2Chinese-x64

jobs:
  # ═════════════════════════════════════════════════
  # 0. 解析版本号（构建与发布共用，无依赖）
  # ═════════════════════════════════════════════════
  version:
    name: 解析版本号
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 计算版本号与变更检测
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          VERSION=""
          LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"

          # 自上一个版本 tag 以来是否存在影响构建产物的变更（无 tag 视为有变更）
          if [[ -n "$LATEST_TAG" ]]; then
            BUILD_CHANGES="$(git diff --name-only "${LATEST_TAG}..HEAD" -- \
              json src third_party CMakeLists.txt CMakePresets.json | wc -l | tr -d ' ')"
          else
            BUILD_CHANGES=1
          fi
          if [[ "$BUILD_CHANGES" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 ${LATEST_TAG} 以来无构建相关变更，auto/定时模式将跳过发布"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "使用 tag 版本: $VERSION"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            INPUT='${{ github.event.inputs.version }}'
            TYPE='${{ github.event.inputs.type }}'
            if [[ -n "$INPUT" ]]; then
              VERSION="${INPUT#v}"
              echo "使用手动输入版本: $VERSION"
            elif [[ "$TYPE" == "auto" || "$TYPE" == "release" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              LATEST="$LATEST_TAG"
              if [[ -z "$LATEST" ]]; then
                echo "本仓库暂无 v* tag，回落上游最新版本"
                LATEST="$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
                  --connect-timeout 15 --max-time 60 \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  https://api.github.com/repos/cngege/GitHubDesktop2Chinese/releases/latest \
                  | jq -r '.tag_name')"
              fi
              if [[ -z "$LATEST" || "$LATEST" == "null" ]]; then
                echo "::error::无法确定基础版本号，请手动输入 version"
                exit 1
              fi
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              PATCH="${PATCH:-0}"
              VERSION="$MAJOR.$MINOR.$((PATCH+1))"
              echo "自动升级版本: $LATEST -> v$VERSION"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════
  # 1. 构建（仅 64 位 x64）
  #    触发：tag / PR / 定时 / 手动(auto/build/release)
  # ═════════════════════════════════════════════════
  build:
    name: 构建 (x64)
    needs: version
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'build' || inputs.type == 'release'))
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 缓存 OpenSSL 静态库
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: third_party/openssl/lib
          key: openssl-libs-${{ runner.os }}-x64-${{ hashFiles('third_party/openssl/include/**', 'CMakeLists.txt') }}

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          $ver = if ($env:RELEASE_VERSION) { "v$env:RELEASE_VERSION" } else { "ci-${{ github.sha }}" }
          # CMake 配置含第三方库下载，网络抖动时自动重试
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake -B build -A x64 -DGitHubActions=1 "-DFILE_VERSION=$ver"
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -ge 3) { Write-Error "CMake 配置连续失败 3 次"; exit 1 }
            Write-Warning "CMake 配置失败(第 $attempt 次)，15 秒后重试"
            Start-Sleep -Seconds 15
          }

      - name: Build (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config $env:BUILD_TYPE

      - name: 上传构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ needs.version.outputs.version || github.sha }}
          if-no-files-found: error
          # 编译输出固定于 build/Release/（MSVC 多配置生成器）
          path: build/Release/${{ env.EXE_NAME }}

  # ═════════════════════════════════════════════════
  # 2. localization.json 质量校验
  # ═════════════════════════════════════════════════
  json-quality:
    name: localization.json 质量校验
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 深度校验 localization.json
        run: |
          python - <<'PY'
          import json, re, sys

          sys.stdout.reconfigure(encoding="utf-8")

          path = "json/localization.json"
          raw = open(path, encoding="utf-8").read()
          data = json.loads(raw)

          errors = []
          warnings = []

          if "【待翻译】" in raw:
              errors.append("存在未替换的草稿占位符【待翻译】，请补全译文后再提交")

          for key in ["version", "minversion", "main", "renderer", "main_dev", "renderer_dev"]:
              if key not in data:
                  errors.append(f"缺少节点: {key}")

          def check_array(name, arr):
              seen = {}
              for i, item in enumerate(arr):
                  if not isinstance(item, list):
                      errors.append(f"{name}[{i}] 不是数组")
                      continue
                  if len(item) < 2 or len(item) > 3:
                      errors.append(f"{name}[{i}] 长度应为 2 或 3，实际 {len(item)}")
                      continue
                  if not all(isinstance(x, str) for x in item):
                      errors.append(f"{name}[{i}] 含非字符串元素")
                      continue
                  pat = item[0]
                  if not pat or pat == '""':
                      continue  # 空串与 "" 占位(应用侧视为跳过)不参与校验
                  try:
                      re.compile(pat)
                  except re.error as e:
                      errors.append(f"{name}[{i}] 非法正则: {pat!r} -> {e}")
                  if pat in seen:
                      warnings.append(f"{name} 重复查找项: {pat!r} (index {seen[pat]} 与 {i})")
                  else:
                      seen[pat] = i
                  # ReDoS 启发式(仅告警不阻断): 嵌套量词(如 (a+)+ 、 (.*x)* )在长文本上可能灾难性回溯卡死加载器
                  if re.search(r"\([^()]*[+*][^()]*\)\s*[+*{]", pat):
                      warnings.append(f"{name}[{i}] 疑似灾难性回溯(嵌套量词), 请改写该正则: {pat!r}")

          for key in ["main", "renderer", "main_dev", "renderer_dev"]:
              if isinstance(data.get(key), list):
                  check_array(key, data[key])

          for si, sel in enumerate(data.get("select", [])):
              if "replaceFile" not in sel:
                  errors.append(f"select[{si}] 缺少 replaceFile")
              if not isinstance(sel.get("replace"), list):
                  errors.append(f"select[{si}] replace 应为数组")

          print(f"映射项统计: main={len(data.get('main', []))} renderer={len(data.get('renderer', []))}")
          if warnings:
              print(f"\n⚠️  {len(warnings)} 个警告:")
              for w in warnings[:20]:
                  print(f"  - {w}")
          if errors:
              print(f"\n❌ {len(errors)} 个错误:")
              for e in errors[:30]:
                  print(f"  - {e}")
              sys.exit(1)
          print("\n✅ localization.json 质量校验通过")
          PY

  # ═════════════════════════════════════════════════
  # 3. 自动维护工具自检（语法 + 单元测试）
  # ═════════════════════════════════════════════════
  tools-test:
    name: 自动维护工具自检
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security' || inputs.type == 'maintain'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 语法检查
        working-directory: tools/auto-maintain
        run: |
          for f in src/*.js; do node --check "$f"; done
          echo "所有源文件语法检查通过"

      - name: 单元测试（提取过滤 + 草稿生成逻辑）
        working-directory: tools/auto-maintain
        run: |
          node --input-type=module -e "
          import { isLikelyUiText, buildDraftLine } from './src/extract-new.js';
          const cases = [
            ['Do not show this message again', true],
            ['into ', false],
            ['  leading space', false],
            ['h:mm aaa', false],
            ['[object Object]', false],
            ['rgba(255, 255, 255, 0.3)', false],
            ['GitHub Desktop', true],
          ];
          let pass = 0;
          for (const [s, exp] of cases) {
            const got = isLikelyUiText(s);
            if (got !== exp) { console.error('FAIL:', JSON.stringify(s), 'got', got, 'exp', exp); process.exit(1); }
            pass++;
          }
          // 草稿行必须是合法 JSON，且查找项按字面量匹配
          for (const text of ['GitHub Desktop', 'Checkout commit?', 'No usage limit']) {
            const outer = JSON.parse('[' + buildDraftLine(text) + ']');
            const entry = outer[0];
            if (!Array.isArray(entry) || entry.length !== 2 || !entry.every(x => typeof x === 'string')) {
              console.error('FAIL: draft 非法', text); process.exit(1);
            }
            if (!new RegExp(entry[0]).test('\"' + text + '\"')) {
              console.error('FAIL: draft 模式匹配不到字面量', text); process.exit(1);
            }
            pass++;
          }
          console.log('单元测试通过:', pass, '项');
          "

  # ═════════════════════════════════════════════════
  # 4. CodeQL 安全扫描（PR / 手动 auto|security，不含定时以节省资源）
  # ═════════════════════════════════════════════════
  codeql:
    name: CodeQL 安全扫描
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'security'))
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # cpp 语言查询包不支持 overlay-base 增量分析，显式关闭以避免构建回退告警
      CODEQL_OVERLAY_DATABASE_MODE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 缓存 OpenSSL 静态库
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: third_party/openssl/lib
          key: openssl-libs-${{ runner.os }}-x64-${{ hashFiles('third_party/openssl/include/**', 'CMakeLists.txt') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="codeql"

      - name: Build for CodeQL
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:c-cpp"

  # ═════════════════════════════════════════════════
  # 5. 自动维护（失效检测 + 候选提取 → 创建/更新 Issue）
  #    触发：定时 / 手动(auto|maintain)
  # ═════════════════════════════════════════════════
  auto-maintain:
    name: 失效检测 + 未翻译候选提取
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'auto' || inputs.type == 'maintain'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # fetch.js 查询 GitHub API 时使用；匿名限额 60 次/小时会被共享 runner IP 触发 403
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 维护工作目录: 基于 runner 系统临时目录, 不硬编码绝对路径
      WORK_DIR: ${{ runner.temp }}/ghdesktop-auto-maintain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: 安装解压工具（缺失时）
        run: |
          command -v unzip >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y unzip; }

      - name: 查询 GitHub Desktop 最新版本
        id: version
        working-directory: tools/auto-maintain
        run: |
          set -euo pipefail
          LATEST=""
          for attempt in 1 2 3; do
            if LATEST="$(timeout 120 node -e "import('./src/fetch.js').then(async m=>{const r=await m.getLatestRelease();console.log(r.version)}).catch(e=>{console.error(e.message);process.exit(1)})")"; then
              break
            fi
            echo "::warning::查询 GitHub Desktop 最新版本失败(第 ${attempt} 次)，10 秒后重试"
            sleep 10
          done
          [[ -n "$LATEST" ]] || { echo "::error::查询 GitHub Desktop 最新版本连续失败 3 次"; exit 1; }
          echo "ghdesktop_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "查询到 GitHub Desktop 最新版本: $LATEST"

      - name: 缓存安装包与提取结果
        id: cache-maintain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.WORK_DIR }}
          key: ghd-maintain-v2-${{ steps.version.outputs.ghdesktop_version }}-${{ runner.os }}-${{ hashFiles('tools/auto-maintain/src/**') }}-${{ hashFiles('json/localization.json') }}

      - name: 运行失效检测 + 未翻译候选提取
        working-directory: tools/auto-maintain
        run: |
          set -euo pipefail
          attempt=0
          until timeout 1200 node src/index.js check extract \
            --workdir "$WORK_DIR" \
            --top 100 \
            --write-report; do
            attempt=$((attempt + 1))
            if [[ $attempt -ge 2 ]]; then
              echo "::error::失效检测连续失败 2 次"
              exit 1
            fi
            echo "::warning::失效检测失败(第 ${attempt} 次)，20 秒后重试"
            sleep 20
          done

      - name: 创建或更新自动维护 Issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            try {
              const fs = require('fs');
              const path = require('path');
              const reportPath = path.join(process.env.WORK_DIR, 'report.md');
              const report = fs.readFileSync(reportPath, 'utf8');

              const failedMatch = report.match(/总映射项\s+(\d+)，有效\s+(\d+)，失效\s+(\d+)。/);
              const failed = failedMatch ? failedMatch[3] : '?';
              const noFailures = Number(failed) === 0;

              const title = `[自动维护] 汉化映射失效 ${failed} 项 / 未翻译候选 (GitHub Desktop 报告)`;
              const today = new Date().toISOString().slice(0, 10);
              const body = [
                `## 自动维护报告（${today}）`,
                '',
                '本 Issue 由自动维护工作流生成，用于提醒维护者关注汉化映射的健康度。',
                '',
                '> ⚠️ 此报告不直接修改 `localization.json`，请人工确认后处理。',
                '',
                '---',
                '',
                report,
                '',
                '---',
                `_由 [GitHubDesktop2Chinese](https://github.com/${{ github.repository }}/actions/workflows/ghdesktop2chinese.yml) 自动生成_`,
              ].join('\n');

              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: ['auto-maintain'],
              });

              const existing = issues.find(i => i.title.startsWith('[自动维护]'));

              if (noFailures) {
                if (existing) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existing.number,
                    state: 'closed',
                    body: body,
                  });
                  console.log(`已关闭 Issue #${existing.number}（无失效项）`);
                } else {
                  console.log('无失效项且无历史 Issue，无需操作');
                }
                return;
              }

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: title,
                  body: body,
                });
                console.log(`已更新 Issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['auto-maintain'],
                });
                console.log(`已创建 Issue #${created.data.number}`);
              }
            } catch (err) {
              core.setFailed(`创建或更新自动维护 Issue 失败: ${err.message}`);
            }

  # ═════════════════════════════════════════════════
  # 6. 发布 Release（tag v* / 手动 auto|release / 定时且有变更）
  #    依赖 build 产物与 version 版本号
  # ═════════════════════════════════════════════════
  release:
    name: 发布 Release
    needs: [version, build]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'release') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'auto' && needs.version.outputs.changed == 'true') ||
      (github.event_name == 'schedule' && needs.version.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 校验版本号
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          if [[ -z "$VER" ]]; then
            echo "::error::版本号为空，无法发布。请检查 version 任务输出"
            exit 1
          fi
          echo "发布版本: v$VER"

      - name: 下载构建产物 (x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ needs.version.outputs.version || github.sha }}
          path: release/

      - name: 准备 localization.json
        run: |
          set -euo pipefail
          mkdir -p release
          cp "json/localization.json" release/

      - name: 生成 Release 说明
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          {
            echo "# GitHubDesktop2Chinese v$VER"
            echo ""
            echo "自动构建产物："
            echo "- \`GitHubDesktop2Chinese.exe\` — 64 位（仅支持 64 位 Windows）"
            echo "- \`localization.json\` — 汉化映射（最新）"
            echo ""
            echo "## 使用方法"
            echo "1. 下载 \`GitHubDesktop2Chinese.exe\` 双击运行，自动联网获取最新 \`localization.json\` 完成汉化"
            echo "2. 或下载 exe 与 \`localization.json\` 放在同一文件夹运行"
            echo "3. GitHub Desktop 每次版本更新后需重新运行一次"
            echo ""
            echo "> ⚠️ 仅支持 64 位 Windows / GitHub Desktop；找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable"
            if [[ -f docs/ReleaseBody.md ]]; then
              echo ""
              echo "---"
              echo ""
              cat docs/ReleaseBody.md
            fi
          } > release-notes.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="v${{ needs.version.outputs.version }}"
          TITLE="GitHubDesktop2Chinese v${{ needs.version.outputs.version }}"
          # 网络抖动时自动重试（上传支持 --clobber，重试安全）
          retry() {
            local max=$1
            shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [[ $attempt -ge $max ]] && return 1
              echo "::warning::命令失败(第 ${attempt} 次)，15 秒后重试: $*"
              sleep 15
            done
          }
          if gh release view "$VER" >/dev/null 2>&1; then
            retry 3 gh release upload "$VER" release/GitHubDesktop2Chinese.exe release/localization.json --clobber
            gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
          else
            retry 3 gh release create "$VER" release/GitHubDesktop2Chinese.exe release/localization.json --title "$TITLE" --notes-file release-notes.md
          fi
