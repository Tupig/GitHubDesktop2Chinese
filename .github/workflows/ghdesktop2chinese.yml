          fi
          if ! printf '%s' "$OSSL_VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::openssl-version 格式非法: $OSSL_VER（应为 X.Y.Z, 不带 v/openssl- 前缀）"
