          if-no-files-found: error

  # ═════════════════════════════════════════════════
  # 9. 产库验证（四连全部成功后, 组装 third_party, 四平台矩阵构建验证新库可用）
  #    验证通过后才允许 OpensslVendorPR 开入库 PR
  # ═════════════════════════════════════════════════
  OpensslVerify:
    name: 产库验证 (${{ matrix.display }})
    needs: [OpensslLinux, OpensslWin, OpensslMacosArm64, OpensslMacosX64, OpensslCheck]
    if: |
      always() && (
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vendor-openssl') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'vendor') ||
      (github.event_name == 'schedule' && needs.OpensslCheck.outputs.trigger_vendor == 'true')) &&
      needs.OpensslLinux.result == 'success' &&
      needs.OpensslWin.result == 'success' &&
      needs.OpensslMacosArm64.result == 'success' &&
      needs.OpensslMacosX64.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            display: Windows_x64
            os: windows-2025
          - name: macos-x64
            display: macOS_x64
            os: macos-15-intel
            arch: x64
          - name: macos-arm64
            display: macOS_arm64
            os: macos-15
            arch: arm64
          - name: linux-x64
            display: Linux_x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 下载四平台产库产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: vendor-staging
          pattern: openssl-*
          merge-multiple: false

      - name: 组装 third_party
        shell: bash
        run: |
          set -euo pipefail
          # macOS runner 的 /bin/bash 为 3.2, 不支持关联数组(declare -A);
          # 改用 case 映射, 兼容 bash 3.2+(Linux/Windows 的 bash 5 同样适用)
          for art in openssl-linux-x64 openssl-windows-x64 openssl-macos-arm64 openssl-macos-x64; do
            case "$art" in
              openssl-linux-x64)   dst="third_party/openssl-linux-x64" ;;
              openssl-windows-x64) dst="third_party/openssl" ;;
              openssl-macos-arm64) dst="third_party/openssl-macos-arm64" ;;
              openssl-macos-x64)   dst="third_party/openssl-macos-x64" ;;
            esac
            src="vendor-staging/$art"
            [[ -f "$src/include/openssl/ssl.h" ]] || { echo "::error::artifact $art 缺少 include/openssl/ssl.h"; exit 1; }
            rm -rf "$dst/include" "$dst/lib"
            mkdir -p "$dst"
            cp -a "$src/include" "$src/lib" "$dst/"
          done
          echo "third_party 组装完成"

      - name: 安装 sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: 配置 CMake（Windows x64）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DFILE_VERSION="openssl-verify" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: 配置 CMake（macOS/Linux）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ARCH="${{ matrix.arch }}"
            CMAKE_ARCH="$ARCH"
            if [[ "$ARCH" == "x64" ]]; then CMAKE_ARCH="x86_64"; fi
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=$CMAKE_ARCH")
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          EXTRA+=("-DCMAKE_COMPILE_WARNING_AS_ERROR=ON")
          EXTRA+=("-DCMAKE_C_COMPILER_LAUNCHER=sccache")
          EXTRA+=("-DCMAKE_CXX_COMPILER_LAUNCHER=sccache")
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DFILE_VERSION=openssl-verify" ${EXTRA[@]+"${EXTRA[@]}"}

      - name: 构建
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake --build build --config Release
          else
            JOBS="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
            cmake --build build --config Release -j "$JOBS"
          fi

      - name: 产物功能测试
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            NATIVE="$(uname -m)"
            EXPECT="${{ matrix.arch }}"
            if [[ "$EXPECT" == "x64" ]]; then EXPECT="x86_64"; fi
            if [[ "$NATIVE" != "$EXPECT" ]]; then
              echo "跳过: 交叉产物($EXPECT)无法在本 runner($NATIVE) 原生运行"
              exit 0
            fi
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="build/Release/${EXE_NAME}"
          else
            BIN="build/GitHubDesktop2Chinese"
          fi
          [[ -f "$BIN" ]] || { echo "::error::未找到构建产物 $BIN"; exit 1; }

          echo "== 测试1: --help 应 exit 0 =="
          "$BIN" --help > /dev/null
          echo "OK"

          echo "== 测试2: 非法参数应被拒绝(exit!=0) =="
          if "$BIN" thisargdoesnotexist > /dev/null 2>&1; then
            echo "::error::非法参数未被拒绝"
            exit 1
          fi
          echo "OK"

          echo "== 测试3: 中文路径 + EOF 完整汉化流程应 exit 0 =="
          FIXTURE="$RUNNER_TEMP/汉化测试目录"
          rm -rf "$FIXTURE"
          mkdir -p "$FIXTURE"
          printf '<html></html>' > "$FIXTURE/index.html"
          printf '// fixture main\n' > "$FIXTURE/main.js"
          printf '// fixture renderer\n' > "$FIXTURE/renderer.js"
          set +e
          OUT="$(echo "" | "$BIN" -g "$FIXTURE" --nopause --force 2>&1)"
          CODE=$?
          set -e
          if [[ $CODE -ne 0 ]]; then
            echo "$OUT"
            echo "::error::完整流程 exit=$CODE"
            exit 1
          fi
          grep -q "renderer.js 文件汉化结束" <<< "$OUT" || { echo "$OUT"; echo "::error::流程未到达 renderer 汉化完成"; exit 1; }
          echo "OK"

  # ═════════════════════════════════════════════════
  # 10. 产库自动开 PR（验证通过后组装 third_party 并自动开入库 PR, 由维护者审查合并）
  #    GITHUB_TOKEN 创建的 PR 不触发 CI(GitHub 防递归), 审查清单见 PR 描述;
  #    所产版本强制等于 openssl/openssl 3.5 LTS 系列最新(注7), 防止产旧版本入库
  # ═════════════════════════════════════════════════
  OpensslVendorPR:
    name: 产库自动开 PR
    needs: [OpensslLinux, OpensslWin, OpensslMacosArm64, OpensslMacosX64, OpensslCheck, OpensslVerify]
    # 四连 + 验证全部成功才开 PR
    if: |
      always() && (
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'vendor-openssl') ||
      (github.event_name == 'workflow_dispatch' && inputs.type == 'vendor') ||
      (github.event_name == 'schedule' && needs.OpensslCheck.outputs.trigger_vendor == 'true')) &&
      needs.OpensslLinux.result == 'success' &&
      needs.OpensslWin.result == 'success' &&
      needs.OpensslMacosArm64.result == 'success' &&
      needs.OpensslMacosX64.result == 'success' &&
      needs.OpensslVerify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 权限最小化: 仅本 job 授予开 PR 所需写权限, 其余 job 保持工作流级只读
    permissions:
      contents: write
      pull-requests: write
    env:
      OSSL_VER: ${{ needs.OpensslLinux.outputs.resolved_ver }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: 校验所产版本为 3.5 LTS 系列最新
        run: |
          set -euo pipefail
          V_WIN="${{ needs.OpensslWin.outputs.resolved_ver }}"
          V_ARM="${{ needs.OpensslMacosArm64.outputs.resolved_ver }}"
          V_X64="${{ needs.OpensslMacosX64.outputs.resolved_ver }}"
          if [[ -z "$OSSL_VER" || "$OSSL_VER" != "$V_WIN" || "$OSSL_VER" != "$V_ARM" || "$OSSL_VER" != "$V_X64" ]]; then
            echo "::error::四平台解析版本不一致或缺失（供应链异常）:"
            echo "  linux=$OSSL_VER windows=$V_WIN macos-arm64=$V_ARM macos-x64=$V_X64"
            exit 1
          fi
          # 版本策略(注7): 产库须跟随 3.5 LTS 系列最新 patch(3.5 为 LTS 支持至 2030-04;
          # 4.0 非 LTS 不采纳)。正则精确匹配 3.5.x 纯数字 patch, 数值排序取最大
          LATEST_VER="$(gh api "repos/openssl/openssl/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | test("^openssl-3\\.5\\.[0-9]+$")) | .tag_name | ltrimstr("openssl-")] | sort_by(split(".") | map(tonumber)) | last')"
          if [[ -z "$LATEST_VER" || "$LATEST_VER" == "null" ]]; then
            echo "::error::无法查询 OpenSSL 3.5 LTS 系列最新版本（供应链校验依赖）"
            exit 1
          fi
          echo "3.5 LTS 系列最新: $LATEST_VER"
          if [[ "$OSSL_VER" != "$LATEST_VER" ]]; then
            echo "::error::所产版本 $OSSL_VER 非 3.5 LTS 系列最新（最新为 $LATEST_VER）。产库须跟随 LTS 最新 patch, 请以最新版本重新触发"
            exit 1
          fi

      - name: 下载四平台产库产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: vendor-staging
          pattern: openssl-*
          merge-multiple: false

      - name: 校验产物并组装 third_party
        id: assemble
        run: |
          set -euo pipefail
          H_LINUX="${{ needs.OpensslLinux.outputs.tarball_sha256 }}"
          H_WIN="${{ needs.OpensslWin.outputs.tarball_sha256 }}"
          H_ARM="${{ needs.OpensslMacosArm64.outputs.tarball_sha256 }}"
          H_X64="${{ needs.OpensslMacosX64.outputs.tarball_sha256 }}"
          if [[ -z "$H_LINUX" || "$H_LINUX" != "$H_WIN" || "$H_LINUX" != "$H_ARM" || "$H_LINUX" != "$H_X64" ]]; then
            echo "::error::四平台源码包 SHA256 不一致或缺失（供应链异常）:"
            echo "  linux=$H_LINUX windows=$H_WIN macos-arm64=$H_ARM macos-x64=$H_X64"
            exit 1
          fi
          # 同版本跳过判断(#F3): 必须在覆盖 third_party 之前读取仓库现有版本。
          # 此前读取时机在 cp 覆盖之后, 读到的恒为刚复制的新版本 → skip_pr 恒真, 自动开 PR 永不生效;
          # 同版本时提前退出, 既不开 PR 也避免无意义的文件复制
          cur="$(sed -n 's/^# *define *OPENSSL_VERSION_STR "\(.*\)".*/\1/p' third_party/openssl/include/openssl/opensslv.h | head -n1)"
          echo "cur_ver=$cur" >> "$GITHUB_OUTPUT"
          if [[ "$cur" == "$OSSL_VER" ]]; then
            echo "::notice::仓库 third_party 已是 $OSSL_VER, 跳过开 PR"
            echo "skip_pr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declare -A DST=(
            [openssl-linux-x64]="third_party/openssl-linux-x64"
            [openssl-windows-x64]="third_party/openssl"
            [openssl-macos-arm64]="third_party/openssl-macos-arm64"
            [openssl-macos-x64]="third_party/openssl-macos-x64"
          )
          for art in "${!DST[@]}"; do
            src="vendor-staging/$art"
            dst="${DST[$art]}"
            [[ -f "$src/include/openssl/ssl.h" ]] || { echo "::error::artifact $art 缺少 include/openssl/ssl.h"; exit 1; }
            ver="$(sed -n 's/^# *define *OPENSSL_VERSION_STR "\(.*\)".*/\1/p' "$src/include/openssl/opensslv.h" | head -n1)"
            [[ "$ver" == "$OSSL_VER" ]] || { echo "::error::artifact $art 版本宏为 '$ver', 与所产版本 $OSSL_VER 不一致"; exit 1; }
            if [[ "$art" == "openssl-windows-x64" ]]; then
              [[ -f "$src/lib/libssl.lib" && -f "$src/lib/libcrypto.lib" ]] || { echo "::error::artifact $art 缺少 libssl.lib/libcrypto.lib"; exit 1; }
            else
              [[ -f "$src/lib/libssl.a" && -f "$src/lib/libcrypto.a" ]] || { echo "::error::artifact $art 缺少 libssl.a/libcrypto.a"; exit 1; }
            fi
            rm -rf "$dst/include" "$dst/lib"
            mkdir -p "$dst"
            cp -a "$src/include" "$src/lib" "$dst/"
          done
          echo "四平台产物组装完成, 版本宏一致: $OSSL_VER"

      - name: 生成 PR 描述
        run: |
          set -euo pipefail
          [[ "${{ steps.assemble.outputs.skip_pr }}" != "true" ]] || { echo "跳过: 仓库已是 $OSSL_VER"; exit 0; }
          CUR="${{ steps.assemble.outputs.cur_ver }}"
          {
            echo "## 产库自动 PR：OpenSSL $OSSL_VER 四平台静态库入库"
            echo ""
            echo "由产库四连任务全部成功后自动创建。**GITHUB_TOKEN 创建的 PR 不触发 CI**（GitHub 防递归机制），请维护者按下方审查清单逐项确认后合并。"
            echo ""
            echo "### 溯源"
            echo ""
            echo "- 触发运行：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- 上游源码包：\`openssl-$OSSL_VER.tar.gz\`（[官方 Release](https://github.com/openssl/openssl/releases/tag/openssl-$OSSL_VER)）"
            echo "- 源码包 SHA256（四平台产库任务各自独立下载并经官方 \`.sha256\` 校验，已验证四值一致）：\`${{ needs.OpensslLinux.outputs.tarball_sha256 }}\`"
            echo "- 3.5 LTS 系列最新校验：所产版本已核验为 openssl/openssl 3.5 LTS 最新 patch"
            echo ""
            echo "### 产物清单与 SHA256"
            echo ""
            echo "| 平台 | 仓库目录 | 库文件 | SHA256 |"
            echo "| --- | --- | --- | --- |"
            for d in third_party/openssl third_party/openssl-linux-x64 third_party/openssl-macos-arm64 third_party/openssl-macos-x64; do
              for f in "$d"/lib/*; do
                [[ -f "$f" ]] || continue
                echo "| $(basename "$d") | \`$d\` | \`$(basename "$f")\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
              done
            done
            echo ""
            echo "### 审查清单（合并前逐项确认）"
            echo ""
            echo "- [ ] 四个产库任务全部成功（见上方运行链接）"
            echo "- [ ] 源码包 SHA256 与 [openssl.org/source](https://www.openssl.org/source/) 公示值交叉核对"
            echo "- [ ] 检出本 PR 分支本地构建通过（Windows：CMake 构建 + version_test + 冒烟）"
            echo "- [ ] 同步更新文档版本号：\`third_party/README.md\`、\`README.md\`、\`SECURITY.md\`、\`docs/wiki/编译指南.md\`"
            echo "- [ ] 按 \`--squash\` 合并并删除分支"
            echo ""
            echo "### 变更范围"
            echo ""
            echo "- 仅 \`third_party/openssl*\` 四目录二进制替换（版本 $CUR → $OSSL_VER）"
          } > pr-body.md
          echo "--- PR 描述已生成 ---"
          cat pr-body.md

      - name: 创建入库 PR
        run: |
          set -euo pipefail
          [[ "${{ steps.assemble.outputs.skip_pr }}" != "true" ]] || { echo "跳过: 仓库已是 $OSSL_VER"; exit 0; }
          CUR="${{ steps.assemble.outputs.cur_ver }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="vendor/openssl-$OSSL_VER-r$GITHUB_RUN_ID"
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "::notice::分支 $BRANCH 已存在（本次运行疑似重跑），跳过重复开 PR"
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add third_party
          git commit -m "vendor: OpenSSL $OSSL_VER 四平台静态库入库（产库自动 PR）" \
            -m "版本: $CUR -> $OSSL_VER（3.5 LTS 系列最新）; 产物: linux-x64 / windows-x64 / macos-arm64 / macos-x64; 溯源与审查清单见 PR 描述"
          git push origin "$BRANCH"
          gh pr create --title "vendor: OpenSSL $OSSL_VER 四平台静态库入库" --body-file pr-body.md

  # ═════════════════════════════════════════════════
  # 11. 发布 Release（push main 有变更 / tag v* / 手动 auto|release / 定时且有变更）
  #    依赖 build 产物与 version 版本号
  # ═════════════════════════════════════════════════
  Release:
    name: 发布 Release
    needs: [Version, Build, JsonCheck, CodeqlScan]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.Version.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.type == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.type == 'auto' && needs.Version.outputs.changed == 'true') ||
      (github.event_name == 'schedule' && needs.Version.outputs.changed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.Version.outputs.version }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 校验版本号
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          if [[ -z "$VER" ]]; then
            echo "::error::版本号为空，无法发布。请检查 version 任务输出"
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式非法: '$VER'（须为 x.y.z），拒绝发布"
            exit 1
          fi
          echo "发布版本: v$VER"
          LATEST_TAG="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n1 || true)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          if [[ "$PATCH" -gt 1 ]]; then
            EXPECT_PREV="v${MAJOR}.${MINOR}.$((PATCH-1))"
          elif [[ "$MINOR" -gt 0 ]]; then
            EXPECT_PREV="v${MAJOR}.$((MINOR-1)).100"
          elif [[ "$MAJOR" -gt 0 ]]; then
            EXPECT_PREV="v$((MAJOR-1)).100.100"
          else
            EXPECT_PREV=""
          fi
          if [[ -n "$LATEST_TAG" && -n "$EXPECT_PREV" ]]; then
            if [[ "$LATEST_TAG" != "$EXPECT_PREV" ]]; then
              echo "::warning::版本漂移: 当前最新 tag 为 ${LATEST_TAG}, 预期 ${EXPECT_PREV}; 本次实际发布 v${VER}"
            else
              echo "版本链正常: 最新 tag ${LATEST_TAG} -> v${VER}"
            fi
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}-*-${{ needs.Version.outputs.version || github.sha }}
          path: release/
          merge-multiple: true

      - name: 准备 localization.json 与第三方许可声明
        run: |
          set -euo pipefail
          mkdir -p release
          cp "json/localization.json" release/
          cp "THIRD_PARTY_NOTICES.txt" release/

      - name: SignPath 门控判定
        id: signpath_gate
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${SIGNPATH_API_TOKEN:-}" && -n "${SIGNPATH_ORGANIZATION_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SignPath 凭据齐备, 启用 Windows 产物签名链路"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SignPath 凭据不齐备, 跳过 Windows 产物签名(#79 按实际状态门控)"
          fi

      - name: 上传待签名 Windows 产物
        id: upload-unsigned
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-windows-${{ needs.Version.outputs.version || github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: release/GitHubDesktop2Chinese.exe

      - name: SignPath 代码签名（Windows exe）
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'GitHubDesktop2Chinese' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: 替换为已签名 Windows 产物
        if: steps.signpath_gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -f signed/GitHubDesktop2Chinese.exe
          cp signed/GitHubDesktop2Chinese.exe release/GitHubDesktop2Chinese.exe
          echo "已用 SignPath 签名产物替换 release/GitHubDesktop2Chinese.exe"

      - name: 为签名产物重新生成构建溯源证明
        if: steps.signpath_gate.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/GitHubDesktop2Chinese.exe

      - name: 生成 Release 说明
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$RELEASE_VERSION"
          {
            echo "# GitHubDesktop2Chinese v$VER"
            echo ""
            echo "自动构建产物："
            echo "- \`GitHubDesktop2Chinese.exe\` — Windows x64（64 位 Windows）"
            echo "- \`GitHubDesktop2Chinese-macos-x64\` — macOS Intel（x64）"
            echo "- \`GitHubDesktop2Chinese-macos-arm64\` — macOS Apple Silicon（M 系列）"
            echo "- \`GitHubDesktop2Chinese-linux-x64\` — Linux x86_64"
            echo "- \`localization.json\` — 汉化映射（最新）"
            echo ""
            echo "> 产物附带构建溯源证明，可校验来源：\`gh attestation verify <下载的文件> --repo Tupig/GitHubDesktop2Chinese\`"
            if [[ -n "${SIGNPATH_API_TOKEN:-}" && -n "${SIGNPATH_ORGANIZATION_ID:-}" ]]; then
              echo "> Windows 产物使用 [SignPath Foundation](https://signpath.org) 免费开源代码签名证书签名"
            fi
            echo ""
            echo "## 使用方法"
            echo "1. 下载对应平台的程序文件直接运行，自动联网获取最新 \`localization.json\` 完成汉化"
            echo "2. 或将程序文件与 \`localization.json\` 放在同一文件夹运行"
            echo "3. GitHub Desktop 每次版本更新后需重新运行一次"
            echo ""
            echo "> ⚠️ 仅支持 64 位系统 / GitHub Desktop。macOS/Linux 首次运行请先 \`chmod +x\`；"
            echo "> Windows 找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable"
            if [[ -f docs/ReleaseBody.md ]]; then
              CHANGES="$(grep -F "（v$VER）" docs/ReleaseBody.md || true)"
              AUTO_EXTRACTED=""
              if [[ -z "$CHANGES" ]]; then
                TAGS="$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --paginate -q '.[].name' 2>/dev/null || true)"
                if [[ -n "$TAGS" ]]; then
                  PREV_TAG="$(printf '%s\n' "$TAGS" | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -V \
                    | awk -F. -v v="$VER" 'BEGIN { split(v, c, ".") } { p1 = $1; sub(/^v/, "", p1); if ((p1 * 1000000 + $2 * 1000 + $3) < (c[1] * 1000000 + c[2] * 1000 + c[3])) print }' | tail -n1)"
                  if [[ -n "$PREV_TAG" ]]; then
                    SUBJECTS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_SHA}" \
                      -q '.commits[] | select((.parents | length) == 1) | .commit.message | split("\n")[0]' 2>/dev/null || true)"
                    if [[ -n "$SUBJECTS" ]]; then
                      AUTO_ENTRIES=""
                      while IFS= read -r subject; do
                        if [[ -n "$subject" ]]; then
                          AUTO_ENTRIES+="- ${subject}（v$VER）"$'\n'
                        fi
                      done <<< "$SUBJECTS"
                      AUTO_ENTRIES="${AUTO_ENTRIES%$'\n'}"
                      AUTO_ENTRIES="$AUTO_ENTRIES" awk '
                        BEGIN { entries = ENVIRON["AUTO_ENTRIES"] }
                        /^<!--/ && !inserted { print entries; print ""; inserted = 1 }
                        { print }
                      ' docs/ReleaseBody.md > docs/ReleaseBody.md.tmp && mv docs/ReleaseBody.md.tmp docs/ReleaseBody.md
                      CHANGES="$(grep -F "（v$VER）" docs/ReleaseBody.md || true)"
                      AUTO_EXTRACTED="1"
                    fi
                  fi
                fi
              fi
              echo ""
              echo "---"
              echo ""
              if [[ -n "$CHANGES" ]]; then
                echo "## 本次更新"
                echo ""
                if [[ -n "$AUTO_EXTRACTED" ]]; then
                  echo "> docs/ReleaseBody.md 未预置 v$VER 条目，以下变更由发布流程自动提取自提交历史"
                  echo ""
                fi
                echo "$CHANGES"
              else
                echo "> ℹ️ 未在 docs/ReleaseBody.md 中找到 v$VER 的变更记录，完整更新历史见仓库文档"
              fi
              NOTES="$(awk '/^### 程序说明/{f=1} f' docs/ReleaseBody.md || true)"
              if [[ -n "$NOTES" ]]; then
                echo ""
                echo "---"
                echo ""
                echo "$NOTES"
              fi
            fi
          } > release-notes.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="v$RELEASE_VERSION"
          TITLE="GitHubDesktop2Chinese v$RELEASE_VERSION"
          retry() {
            local max=$1
            shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [[ $attempt -ge $max ]] && return 1
              echo "::warning::命令失败(第 ${attempt} 次)，15 秒后重试: $*"
              sleep 15
            done
          }
          publish() {
            retry 3 gh release upload "$VER" release/* --clobber
            retry 3 gh release edit "$VER" --title "$TITLE" --notes-file release-notes.md
          }
          if gh release view "$VER" >/dev/null 2>&1; then
            publish
          else
            if ! retry 3 gh release create "$VER" release/* --title "$TITLE" --notes-file release-notes.md; then
              echo "::warning::gh release create 失败, 按已存在场景转上传+编辑自愈"
              publish
            fi
          fi

  # ═════════════════════════════════════════════════
  # 11. CI 失败通知 —— 定时构建失败不再静默堆积(#131)
  # ═════════════════════════════════════════════════
  # 仅 schedule 触发(push/PR 失败在 Actions/PR 页即时可见, 无需 Issue 渠道):
  #   本次 run 有失败 job → 创建/更新单条 "[CI 失败]" Issue(标题带连续失败次数);
  #   本次 run 无失败 job → 自动关闭历史失败 Issue(评论恢复链接)
  # needs 全部任务 + !cancelled(): 失败也要跑(通知的意义正在于失败); 通知脚本自身
  # 失败仅 warning 不使本任务变红(避免"通知失败→run 红→下次又通知"的噪音循环)
  CiNotify:
    name: CI 失败通知
    needs: [Version, Build, JsonCheck, CodeqlScan, OpensslCheck, OpensslLinux, OpensslWin, OpensslMacosArm64, OpensslMacosX64, OpensslVerify, OpensslVendorPR, Release]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 通知定时构建结果
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const notify = require('./tools/ci/ci-failure-notify.js');
            await notify({ github, context, core });
