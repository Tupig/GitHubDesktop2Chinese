name: Vendor OpenSSL (macOS)

# 手动触发的 macOS OpenSSL 静态库「生产」工作流（#98）：
# 产出的 include/ + lib/{libssl.a,libcrypto.a}（双架构各一份）以 artifact 上传，
# 由维护者下载后提交至 third_party/openssl-macos-{x64,arm64}/（步骤见 third_party/README.md）。
# 默认固定 openssl-3.5.9（与 Windows 内置库一致）；升级 LTS 时通过输入参数指定新版本。
# 本工作流常驻仓库供未来升级复用，不参与 push/schedule 日常 CI。
#
# pull_request 触发为「引导」通道：workflow_dispatch 只能触发已登记在默认分支的工作流，
# 本工作流首次入库时尚不在 main，故临时以 pull_request(paths 限本文件) 在 PR 上产出库；
# 入库后移除该触发，保留 workflow_dispatch 供未来 LTS 升级手动复用（见 PR 说明）。
on:
  workflow_dispatch:
    inputs:
      openssl-version:
        description: 'OpenSSL 版本（仅 LTS，如 3.5.9）'
        required: true
        default: '3.5.9'
        type: string
  pull_request:
    paths:
      - .github/workflows/vendor-openssl.yml

permissions:
  contents: read

concurrency:
  group: vendor-openssl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor:
    name: 构建 macOS 静态 OpenSSL (${{ matrix.arch }})
    # 与主构建工作流相同的 Intel runner：同 SDK/clang，x64 原生 + arm64 交叉，保证库与 CI 现网产物同源
    runs-on: macos-15-intel
    timeout-minutes: 40
    strategy:
      # 单架构失败不取消另一架构：一次运行尽可能拿到全部产物
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: 下载并构建 OpenSSL (${{ matrix.arch }})
        shell: bash
        env:
          # 非 workflow_dispatch 触发（引导期 pull_request）时 inputs 为空，回退默认版本
          OSSL_VER: ${{ inputs.openssl-version || '3.5.9' }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "OpenSSL 版本: $OSSL_VER ($ARCH)"
          [[ "$OSSL_VER" =~ ^3\.[0-9]+\.[0-9]+$ ]] || { echo "::error::OpenSSL 版本号异常: $OSSL_VER"; exit 1; }
          case "$ARCH" in
            x64)   TARGET="darwin64-x86_64-cc" ;;
            arm64) TARGET="darwin64-arm64-cc" ;;
            *)     echo "::error::未知架构: $ARCH"; exit 1 ;;
          esac
          URL="https://github.com/openssl/openssl/releases/download/openssl-${OSSL_VER}/openssl-${OSSL_VER}.tar.gz"
          TMP="$(mktemp -d)"
          PREFIX="$GITHUB_WORKSPACE/openssl-macos-$ARCH"
          echo "下载 $URL"
          curl -fsSL --retry 3 --retry-delay 5 -o "$TMP/openssl.tar.gz" "$URL"
          # arm64 产物最低支持 macOS 11；部署目标与主构建工作流保持一致（11.0）
          export MACOSX_DEPLOYMENT_TARGET=11.0
          mkdir -p "$TMP/src"
          tar -xzf "$TMP/openssl.tar.gz" -C "$TMP/src" --strip-components=1
          cd "$TMP/src"
          # no-zlib: 静态链接后不引入 zlib 依赖（与主构建工作流一致）
          ./Configure "$TARGET" no-shared no-tests no-apps no-zlib --prefix="$PREFIX" --openssldir="$PREFIX/ssl"
          make -j"$(sysctl -n hw.ncpu)" build_libs
          make install_dev
          [[ -f "$PREFIX/lib/libssl.a" && -f "$PREFIX/lib/libcrypto.a" ]] || { echo "::error::OpenSSL $ARCH 静态库缺失"; exit 1; }
          echo "OpenSSL $ARCH 完成: $PREFIX"

      - name: 上传产物 (openssl-macos-${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752aef8333 # v7
        with:
          name: openssl-macos-${{ matrix.arch }}
          # 仅上传 CMake 所需的 include/ 与 lib/（证书目录 ssl/ 等不随仓库提交）
          path: |
            openssl-macos-${{ matrix.arch }}/include/
            openssl-macos-${{ matrix.arch }}/lib/
          if-no-files-found: error
          retention-days: 7
